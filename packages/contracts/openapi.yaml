                      $ref: '#/components/schemas/AuditLog'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: dateFrom
        in: query
        schema:
          type: string
          format: date
      - name: dateTo
        in: query
        schema:
          type: string
          format: date
      - name: search
        in: query
        schema:
          type: string
          maxLength: 200
      - name: action
        in: query
        schema:
          type: string
      - name: userId
        in: query
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
          example: '1001'
          description: معرّف BIGINT يُنقل كنص لتجنب فقدان الدقة في JavaScript.
      - name: entityType
        in: query
        schema:
          type: string
          maxLength: 80
      x-permission: audit_logs.view
      security:
      - SessionCookie: []
  /audit-logs/options:
    get:
      tags: [Logs]
      summary: خيارات تصفية سجل التدقيق المتاحة داخل الشركة الحالية
      operationId: getAuditLogOptions
      x-permission: audit_logs.view
      security:
      - SessionCookie: []
      responses:
        '200':
          description: الخيارات المتاحة
          content:
            application/json:
              schema:
                type: object
                required: [actions, entityTypes, users]
                properties:
                  actions: { type: array, items: { type: string } }
                  entityTypes: { type: array, items: { type: string } }
                  users:
                    type: array
                    items:
                      type: object
                      required: [id, name, email]
                      properties:
                        id: { $ref: '#/components/schemas/Id' }
                        name: { type: string }
                        email: { type: string, format: email }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /audit-logs/export.csv:
    get:
      tags: [Logs]
      summary: تصدير سجل التدقيق المصفى بصيغة CSV آمنة
      description: يعيد ملف UTF-8 بحد أقصى 10000 سجل ويمنع حقن صيغ جداول البيانات.
      operationId: exportAuditLogs
      x-permission: audit_logs.export
      security:
      - SessionCookie: []
      parameters:
      - name: dateFrom
        in: query
        schema: { type: string, format: date }
      - name: dateTo
        in: query
        schema: { type: string, format: date }
      - name: search
        in: query
        schema: { type: string, maxLength: 200 }
      - name: action
        in: query
        schema: { type: string, maxLength: 120 }
      - name: entityType
        in: query
        schema: { type: string, maxLength: 80 }
      - name: userId
        in: query
        schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: ملف CSV وسجل تدقيق لعملية التصدير
          headers:
            X-Export-Row-Count: { schema: { type: string } }
            X-Export-Truncated: { schema: { type: string, enum: ['true', 'false'] } }
          content:
            text/csv:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /audit-logs/{auditLogId}:
    get:
      tags: [Logs]
      summary: عرض تفاصيل حدث تدقيق داخل الشركة الحالية
      operationId: getAuditLog
      x-permission: audit_logs.view
      security:
      - SessionCookie: []
      parameters:
      - name: auditLogId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: تفاصيل الحدث
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /security-events:
    get:
      tags: [Logs]
      summary: عرض سجل الأمان المصفى داخل الشركة الحالية
      operationId: listSecurityEvents
      x-permission: security_events.view
      security:
      - SessionCookie: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: search
        in: query
        schema: { type: string, maxLength: 200 }
      - name: eventType
        in: query
        schema: { type: string, maxLength: 80 }
      - name: severity
        in: query
        schema: { $ref: '#/components/schemas/SecuritySeverity' }
      - name: userId
        in: query
        schema: { $ref: '#/components/schemas/Id' }
      - name: unacknowledgedOnly
        in: query
        schema: { type: boolean }
      - name: dateFrom
        in: query
        schema: { type: string, format: date }
      - name: dateTo
        in: query
        schema: { type: string, format: date }
      responses:
        '200':
          description: قائمة الأحداث الأمنية
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SecurityEvent' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /security-events/summary:
    get:
      tags: [Logs]
      summary: ملخص تنبيهات الأمان وأحداث آخر 24 ساعة
      operationId: getSecurityEventSummary
      x-permission: security_events.view
      security:
      - SessionCookie: []
      responses:
        '200':
          description: ملخص الأمان
          content:
            application/json:
              schema:
                type: object
                required: [last24Hours, unacknowledgedAlerts, latestCriticalAt]
                properties:
                  last24Hours:
                    type: object
                    required: [info, warning, high, critical]
                    properties:
                      info: { type: integer, minimum: 0 }
                      warning: { type: integer, minimum: 0 }
                      high: { type: integer, minimum: 0 }
                      critical: { type: integer, minimum: 0 }
                  unacknowledgedAlerts: { type: integer, minimum: 0 }
                  latestCriticalAt: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /security-events/options:
    get:
      tags: [Logs]
      summary: خيارات تصفية سجل الأمان
      operationId: getSecurityEventOptions
      x-permission: security_events.view
      security:
      - SessionCookie: []
      responses:
        '200':
          description: خيارات التصفية
          content:
            application/json:
              schema:
                type: object
                required: [eventTypes, users]
                properties:
                  eventTypes: { type: array, items: { type: string } }
                  users:
                    type: array
                    items:
                      type: object
                      required: [id, name, email]
                      properties:
                        id: { $ref: '#/components/schemas/Id' }
                        name: { type: string }
                        email: { type: string, format: email }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /security-events/{securityEventId}/acknowledge:
    post:
      tags: [Logs]
      summary: الإقرار بمراجعة تنبيه أمني
      operationId: acknowledgeSecurityEvent
      x-permission: security_events.acknowledge
      security:
      - SessionCookie: []
        CsrfToken: []
      parameters:
      - name: securityEventId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: الحدث بعد الإقرار
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityEvent' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: sid
      description: معرف جلسة عشوائي؛ القيمة الخام لا تُخزن في قاعدة البيانات.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: رمز Synchronizer مرتبط بالجلسة ومطلوب لكل طلب يغير الحالة.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 200
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID أو قيمة عشوائية فريدة للعملية. تُخزن النتيجة 24 ساعة افتراضياً.
      schema:
        type: string
        minLength: 16
        maxLength: 100
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
  responses:
    ValidationError:
      description: خطأ في التنسيق أو الحقول
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: الجلسة مفقودة أو منتهية أو ملغاة
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: لا توجد صلاحية أو سياق الشركة غير مصرح به
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: الكيان غير موجود داخل الشركة الحالية؛ لا يكشف وجوده في شركة أخرى
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: تعارض إصدار أو تزامن أو تكرار
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    BusinessRuleViolation:
      description: انتهاك قاعدة أعمال، مثل فترة مغلقة أو قيد غير متوازن
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: تم تجاوز معدل الطلبات
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: خطأ داخلي؛ يعاد requestId فقط دون تفاصيل حساسة
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Id:
      type: string
      pattern: ^[1-9][0-9]*$
      example: '1001'
      description: معرّف BIGINT يُنقل كنص لتجنب فقدان الدقة في JavaScript.
    Amount:
      type: string
      pattern: ^(0|[1-9][0-9]{0,14})\.[0-9]{4}$
      example: '1250.0000'
      description: قيمة مالية عشرية DECIMAL(19,4) كنص.
    PaginationMeta:
      type: object
      required:
      - page
      - pageSize
      - totalItems
      - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    Problem:
      type: object
      required:
      - code
      - messageAr
      - requestId
      properties:
        code:
          type: string
          enum:
          - VALIDATION_ERROR
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - CONFLICT
          - BUSINESS_RULE_VIOLATION
          - RATE_LIMITED
          - INTERNAL_ERROR
        messageAr:
          type: string
        requestId:
          type: string
          format: uuid
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        details:
          type: object
          additionalProperties: true
          description: تفاصيل آمنة فقط؛ لا تتضمن SQL أو Stack Trace أو قيماً حساسة.
    HealthResponse:
      type: object
      required:
      - status
      - database
      - time
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        database:
          type: string
          enum:
          - up
          - down
        time:
          type: string
          format: date-time
          example: '2026-07-30T06:00:00.000Z'
        version:
          type: string
          example: 1.0.0
    CsrfTokenResponse:
      type: object
      required:
      - csrfToken
      properties:
        csrfToken:
          type: string
          minLength: 32
        expiresAt:
          type: string
          format: date-time
          example: '2026-07-30T06:00:00.000Z'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 200
    SelectCompanyRequest:
      type: object
      additionalProperties: false
      required:
      - companyId
      properties:
        companyId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: '1001'
          description: معرّف BIGINT يُنقل كنص لتجنب فقدان الدقة في JavaScript.
    CompanyAccess:
      type: object
      required:
      - companyId
      - code
      - legalNameAr
      - roles
      - permissions
      properties:
        companyId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: '1001'
          description: معرّف BIGINT يُنقل كنص لتجنب فقدان الدقة في JavaScript.
        code:
          type: string
        legalNameAr:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    CompanyAccessList:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CompanyAccess'
    AuthenticatedUser:
      type: object
      required:
      - id
      - email
      - nameAr
      - status
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: '1001'
          description: معرّف BIGINT يُنقل كنص لتجنب فقدان الدقة في JavaScript.
        email:
          type: string
          format: email
        nameAr:
          type: string
        nameEn:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - ACTIVE
          - LOCKED
          - DISABLED
    AuthSessionResponse:
      type: object
      required:
      - user
      - csrfToken
      - companies
      properties:
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
        csrfToken:
          type: string
        selectedCompany:
          oneOf:
          - $ref: '#/components/schemas/CompanyAccess'
          - type: 'null'
        companies:
          type: array
          items:
            $ref: '#/components/schemas/CompanyAccess'
        sessionExpiresAt:
          type: string
          format: date-time
          example: '2026-07-30T06:00:00.000Z'
    Session:
      type: object
      required:
      - id
      - createdAt
      - lastActivityAt
      - expiresAt
      - current
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: '1001'
          description: معرّف BIGINT يُنقل كنص لتجنب فقدان الدقة في JavaScript.
        createdAt:
          type: string
          format: date-time
          example: '2026-07-30T06:00:00.000Z'
        lastActivityAt:
          type: string
          format: date-time
          example: '2026-07-30T06:00:00.000Z'
        expiresAt:
          type: string
          format: date-time
          example: '2026-07-30T06:00:00.000Z'
        revokedAt:
          oneOf:
          - type: string
            format: date-time
            example: '2026-07-30T06:00:00.000Z'
          - type: 'null'
        current:
          type: boolean
        ipMasked:
          type:
          - string
          - 'null'
        userAgentSummary:
          type:
          - string
          - 'null'
    UserStatus:
      type: string
      enum:
      - ACTIVE
      - LOCKED
      - DISABLED
    User:
      type: object
      required:
      - id
      - email
      - nameAr
      - status
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: '1001'
          description: معرّف BIGINT يُنقل كنص لتجنب فقدان الدقة في JavaScript.
        email:
          type: string
          format: email
        nameAr:
          type: string
          maxLength: 160
        nameEn:
          type:
          - string
          - 'null'
          maxLength: 160
        status:
          $ref: '#/components/schemas/UserStatus'
        lastLoginAt:
          oneOf:
          - type: string
            format: date-time
            example: '2026-07-30T06:00:00.000Z'
          - type: 'null'
        createdAt:
          type: string
          format: date-time
          example: '2026-07-30T06:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-07-30T06:00:00.000Z'
    UserCreateRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - nameAr
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        nameAr:
          type: string
          minLength: 1
          maxLength: 160
        nameEn:
          type:
          - string
          - 'null'
          maxLength: 160
        temporaryPassword:
          type:
          - string
          - 'null'
          minLength: 12
          description: اختياري؛ لا يعاد في الاستجابة.
    UserUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nameAr:
          type: string
          minLength: 1
          maxLength: 160
        nameEn:
          type:
          - string
          - 'null'
          maxLength: 160
    Role:
      type: object
      required:
      - id
      - code
      - nameAr
      - isSystemRole
      - isActive
      - permissions
      - permissionIds
      - assignedUsers
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: '1001'
          description: معرّف BIGINT يُنقل كنص لتجنب فقدان الدقة في JavaScript.
        code:
          type: string
        nameAr:
          type: string
        nameEn:
          type:
          - string
          - 'null'
        isSystemRole:
          type: boolean
        isActive:
          type: boolean
        permissions:
          type: array
          items:
            type: string
        permissionIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        assignedUsers:
          type: integer
          minimum: 0
    RoleCreateRequest:
      type: object
      additionalProperties: false
      required: [code, nameAr, permissionIds]
      properties:
        code: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_]{1,79}$' }
        nameAr: { type: string, minLength: 1, maxLength: 120 }
        nameEn: { type: [string, 'null'], maxLength: 120 }
        permissionIds:
          type: array
          uniqueItems: true
          maxItems: 200
          items: { $ref: '#/components/schemas/Id' }
    RoleUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nameAr: { type: string, minLength: 1, maxLength: 120 }
        nameEn: { type: [string, 'null'], maxLength: 120 }
    RolePermissionsRequest:
      type: object
      additionalProperties: false
      required: [permissionIds]
      properties:
        permissionIds:
          type: array
          uniqueItems: true
          maxItems: 200
          items: { $ref: '#/components/schemas/Id' }
    RoleList:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    Permission:
      type: object
      required:
      - id
      - code
      - module
      - descriptionAr
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: '1001'
          description: معرّف BIGINT يُنقل كنص لتجنب فقدان الدقة في JavaScript.
        code:
          type: string
        module:
          type: string
        descriptionAr:
          type: string
    PermissionList:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    UserRoleAssignment:
      type: object
      required:
      - roleId
      - roleCode
      - isActive
      - assignedAt
      properties:
        roleId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: '1001'
          description: معرّف BIGINT يُنقل كنص لتجنب فقدان الدقة في JavaScript.
        roleCode:
          type: string
        isActive:
          type: boolean
        assignedAt:
          type: string
          format: date-time
          example: '2026-07-30T06:00:00.000Z'
    UserRoleAssignmentList:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserRoleAssignment'
    ReplaceUserRolesRequest:
      type: object
      additionalProperties: false
      required:
      - roleIds
      properties:
        roleIds:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: ^[1-9][0-9]*$
            example: '1001'
            description: معرّف BIGINT يُنقل كنص لتجنب فقدان الدقة في JavaScript.
          maxItems: 20
    Company:
      type: object
      required:
      - id
      - name
      - baseCurrencyId
      - baseCurrency
      - timezone
      - isActive
      - manualJournalMakerCheckerEnabled
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: '1001'
          description: معرّف BIGINT يُنقل كنص لتجنب فقدان الدقة في JavaScript.
        name:
