openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Core Accounting MVP API
  version: 1.46.0
  description: 'مواصفات REST API للنواة المحاسبية القابلة للتوسع.


    مصادر التصميم: ERD v1.2، قاموس البيانات v1.2، مصفوفة الصلاحيات وقواعد الترحيل v1.1، وحالات الاستخدام وتدفقات العمل v1.0، مع تعديلات ADR-002 v1.3.


    قرارات تنفيذية مثبتة في هذه النسخة:

    - الشركة الحالية تُثبت في الجلسة عبر /auth/context، ولا يُعتمد companyId الوارد من العميل في العمليات التشغيلية.

    - رقم المستند يُحجز عند إنشاء المسودة مع قبول فجوات الأرقام الموثقة.

    - منشئ القيد اليدوي لا يرحله افتراضياً، ويمكن جعل ذلك إعداداً للشركات الصغيرة.

    - أوامر الترحيل والعكس وإغلاق الفترات تعلن أخطاء استنفاد إعادة المعاملة والمهلة المشتركة بصيغتي 503 و504 المعياريتين.

    - تبدأ مهلة مطلقة واحدة عند HTTP وتنتقل إلى الأوامر والمعاملات؛ لا يعاد ضبطها عند Retry، ولا يرسل الخادم نجاحاً متأخراً.

    - يعرض /metrics قياسات Prometheus تشغيلية منخفضة الكاردينالية عند تفعيله، ويحميه Bearer مستقل في الإنتاج.

    - تخصيصات القبض والدفع تستخدم ReceivableItemId وPayableItemId المملوكين لـAR/AP؛ لا تعبر معرفات أسطر الأستاذ حدود المجالات.

    - يملك Tax نسب الضرائب وحساباتها وسياسة التقريب؛ تحمل تعديلات النسب version متفائلًا لمنع فقد تحديثات المبيعات والمشتريات.

    - يملك Treasury حسابات النقد والبنوك وطرق الدفع؛ تستهلك حركات القبض والصرف TreasuryInstrumentPort وتحمل تعديلات المراجع version متفائلًا.

    - يملك محرك الموافقات طلب الموافقة والقرار فقط؛ أول تطبيق يفرض Maker/Checker على مراجعة إقفال الفترة، بينما يبقى Fiscal مالك دورة الإقفال وCore Accounting مالك Ledger.

    - يملك سياق Professional Services المشاريع والقضايا المهنية وإسناد أعضائها وسجلات الوقت والعقود والأسعار ومصدر الفوترة؛ ينشئ ويرحل فاتورة مبيعات عادية ذرياً عبر منفذ Sales، ولا يكرر حقائق الفاتورة أو الذمم أو Ledger.

    - يملك Human Resources الأقسام والمناصب والموظفين والعقود غير المالية؛ Employee مستقل عن User ويرتبط بعضوية Identity اختياريًا عبر منفذ قراءة فقط، ولا تشمل الشريحة الرواتب أو التعويضات.

    - تبدأ رحلة Inventory بإدارة المستودعات المعزولة حسب الشركة، مع رموز خادمية ثابتة ونسخ متفائلة، دون أثر على الأستاذ في هذه المرحلة.

    - يضيف كتالوج Inventory وحدات قياس دلالية وأصنافًا برموز ITM خادمية ثابتة، مع قفل يمنع ربط صنف نشط بوحدة معطلة.

    - يضيف Inventory دفتر حركة كميًا وقيميًا غير قابل للتعديل وإسقاط أرصدة مقفلاً في المعاملة نفسها وفق المتوسط المرجح المتحرك، مع منع المخزون السالب والقيمة غير المتسقة ومفاتيح Idempotency؛ وتستهلك الفواتير نتيجة التقييم لإكمال قيد المخزون وتكلفة المبيعات عبر PostingEngine.

    - OpenAPI هو العقد التنفيذي الموحد لأجسام JSON؛ تولد منه حراس Zod وأنواع الطلب والاستجابة وبصمة تغطية حتمية، وتفحص الاستجابات في بيئات التطوير والاختبار.

    - مدة الاحتفاظ بمفتاح Idempotency هي 24 ساعة افتراضياً وقابلة للضبط.

    - أقصى نطاق تفاعلي للتقارير 366 يوماً.


    المبالغ وأسعار الصرف والمعرفات الكبيرة تُنقل كنصوص للحفاظ على الدقة. الحقول المشفرة وBlind Indexes لا تظهر في الاستجابات
    العامة.


    تغييرات v1.1:

    - اعتماد counter_account_id رسمياً في سندات القبض والصرف العامة.

    - إضافة GET /dashboard/summary ببيانات مشتقة وصلاحيات حقلية.

    - لا تُخزن مؤشرات لوحة المتابعة كمصدر حقيقة مستقل.'
  contact:
    name: Core Accounting MVP Technical Team
  license:
    name: Internal Use
    identifier: LicenseRef-Internal
servers:
- url: /api/v1
  description: مسار نسبي يعمل على نفس أصل الواجهة في جميع البيئات
tags:
- name: Sales Catalog
  description: ملفات بيع الأصناف المملوكة للمبيعات؛ افتراضات وليست عرض سعر نهائيًا.
- name: Health
  description: فحوص حياة الخدمة وجاهزية قاعدة البيانات.
- name: Operations
  description: مخرجات تشغيلية آمنة للمراقبة ولا تحتوي بيانات شركات أو حمولات مالية.
- name: Platform Operations
  description: تشغيل المنصة وفوترة اشتراكات الشركات للمشغلين المدرجين في قائمة السماح المستقلة.
- name: Authentication
  description: المصادقة والجلسات واختيار سياق الشركة.
- name: Users
  description: إدارة المستخدمين وإسناداتهم داخل الشركة.
- name: Roles
  description: الأدوار والصلاحيات المعزولة حسب الشركة.
- name: Companies
  description: بيانات الشركة الحالية وإعداداتها التشغيلية.
- name: Dashboard
  description: ملخص تشغيلي مشتق حسب الشركة والصلاحيات.
- name: Fiscal
  description: السنوات والفترات المالية وتسلسلات المستندات.
- name: Approvals
  description: طلبات وقرارات الموافقة المشتركة؛ لا يملك المحرك حالات المستندات أو آثارها المالية.
- name: Professional Projects
  description: المشاريع والقضايا والاستشارات المهنية وأعضاؤها وسجلات الوقت والعقود والأسعار ومصدر فوترة الوقت المعتمد؛ تبقى حقائق الفاتورة والذمم لدى Sales والقيود لدى Core Accounting.
- name: Human Resources
  description: الهيكل والموظفون والعقود غير المالية؛ الرواتب والهوية الوطنية والحسابات البنكية خارج هذه الشريحة.
- name: Accounts
  description: دليل الحسابات ومراكز التكلفة.
- name: Data Imports
  description: معاينة واعتماد الاستيراد الجماعي الآمن دون تخزين الملف أو بياناته الخام.
- name: Customers
  description: العملاء وعناوينهم وحسابات الذمم.
- name: Suppliers
  description: الموردون وعناوينهم وحسابات الذمم.
- name: Treasury
  description: حسابات النقد والبنوك وطرق الدفع.
- name: Inventory
  description: المستودعات والكتالوج والحركات الكمية والقيمية؛ يملك Inventory التقييم ولا يكتب Ledger مباشرة، بينما تنشئ الفواتير قيود المخزون والتكلفة عبر PostingEngine.
- name: Manual Journals
  description: القيود اليومية اليدوية ودورة الترحيل والعكس.
- name: Receipts
  description: سندات القبض والتخصيصات والطباعة.
- name: Payments
  description: سندات الصرف والتخصيصات والطباعة.
- name: Sales Invoices
  description: فواتير المبيعات والإشعارات الدائنة.
- name: Purchase Invoices
  description: فواتير المشتريات والإشعارات المدينة.
- name: Taxes
  description: نسب الضرائب وحسابات المخرجات والمدخلات وسياسة النسخ المتفائلة.
- name: Reports
  description: التقارير المحاسبية والقوائم المالية والتصدير.
- name: Logs
  description: سجلات التدقيق والأمان والتنبيهات.
security:
- SessionCookie: []
paths:
  /metrics:
    get:
      tags:
      - Operations
      summary: قياسات Prometheus التشغيلية الآمنة
      description: مسار اختياري على جذر الخدمة، يفعّل عبر METRICS_ENABLED. في الإنتاج يلزم رمز Bearer مستقل، ولا تتضمن التسميات companyId أو requestId أو مفاتيح Idempotency أو حمولات مالية.
      operationId: getOperationalMetrics
      servers:
      - url: /
      security:
      - MetricsBearer: []
      responses:
        '200':
          description: قياسات counters وgauges وhistograms بصيغة Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: القياسات غير مفعلة في هذه البيئة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - $ref: '#/components/parameters/RequestId'
  /health:
    get:
      tags:
      - Health
      summary: فحص الخدمة والاتصال بقاعدة البيانات
      operationId: getHealth
      servers:
      - url: /
      responses:
        '200':
          description: نجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: فشل فحص جاهزية اعتماد تشغيلي
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
  /auth/csrf:
    get:
      tags:
      - Authentication
      summary: إنشاء أو تحديث رمز CSRF
      operationId: getCsrfToken
      responses:
        '200':
          description: نجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/RateLimitUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      description: ينشئ جلسة تمهيدية عند الحاجة ويعيد رمز CSRF. تُرسل Cookie الجلسة بخصائص HttpOnly وSameSite، وSecure في
        الإنتاج.
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
  /auth/register/options:
    get:
      tags: [Authentication]
      summary: الخيارات العامة المتاحة للتسجيل الذاتي
      operationId: getSelfRegistrationOptions
      security: []
      responses:
        '200':
          description: العملات العامة والمناطق الزمنية وقوالب دليل الحسابات المتاحة
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationOptionsResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/register:
    post:
      tags: [Authentication]
      summary: بدء تسجيل ذاتي لإنشاء مؤسسة وشركة ومديرها الأول
      operationId: startSelfRegistration
      description: تعاد الاستجابة العامة نفسها سواء كان البريد متاحاً أم مستخدماً، لمنع تعداد الحسابات. لا تُنشأ الشركة قبل التحقق من البريد.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationStartRequest' }
      security:
      - SessionCookie: []
        CsrfToken: []
      responses:
        '202':
          description: قُبل الطلب؛ إذا كان صالحاً سيُرسل رابط التحقق
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationPendingResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/RegistrationUnavailable' }
        '504': { $ref: '#/components/responses/RequestDeadlineExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/register/resend:
    post:
      tags: [Authentication]
      summary: إعادة إرسال رابط تحقق التسجيل
      operationId: resendSelfRegistrationVerification
      description: تستخدم استجابة عامة ثابتة ولا تكشف وجود طلب أو حساب للبريد.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationResendRequest' }
      security:
      - SessionCookie: []
        CsrfToken: []
      responses:
        '202':
          description: قُبل طلب إعادة الإرسال
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationPendingResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/RegistrationUnavailable' }
        '504': { $ref: '#/components/responses/RequestDeadlineExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/register/verify:
    post:
      tags: [Authentication]
      summary: التحقق من البريد وتجهيز المؤسسة والشركة والمدير الأول
      operationId: verifySelfRegistration
      description: عملية ذرّية وقابلة لإعادة المحاولة؛ لا تُترك شركة أو هوية جزئية عند الفشل.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationVerifyRequest' }
      security:
      - SessionCookie: []
        CsrfToken: []
      responses:
        '201':
          description: اكتمل إنشاء مساحة الشركة
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationCompletedResponse' }
        '202':
          description: توجد محاولة تجهيز أخرى قيد التنفيذ؛ يمكن إعادة الطلب بأمان
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationInProgressResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/RegistrationUnavailable' }
        '504': { $ref: '#/components/responses/RequestDeadlineExceeded' }
  /auth/login:
    post:
      tags:
      - Authentication
      summary: تسجيل الدخول
      operationId: login
      responses:
        '200':
          description: نجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/RateLimitUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      description: رسالة الخطأ لا تكشف ما إذا كان البريد موجوداً. بعد خمس محاولات فاشلة يُقفل الحساب 15 دقيقة وفق السياسة
        المعتمدة.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security:
      - SessionCookie: []
        CsrfToken: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
  /auth/password/forgot:
    post:
      tags: [Authentication]
      summary: طلب رابط استعادة كلمة المرور
      operationId: startPasswordReset
      description: تعاد الاستجابة العامة نفسها سواء كان البريد موجودًا أو غير موجود لمنع تعداد الحسابات.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetStartRequest' }
      security:
      - SessionCookie: []
        CsrfToken: []
      responses:
        '202':
          description: قُبل الطلب دون كشف وجود الحساب
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetAcceptedResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/RateLimitUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
      parameters:
      - $ref: '#/components/parameters/RequestId'
  /auth/password/reset:
    post:
      tags: [Authentication]
      summary: تعيين كلمة مرور جديدة برمز أحادي الاستعمال
      operationId: completePasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetCompleteRequest' }
      security:
      - SessionCookie: []
        CsrfToken: []
      responses:
        '204': { description: عُيّنت كلمة المرور وأُلغيت الجلسات السابقة }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/RateLimitUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
      parameters:
      - $ref: '#/components/parameters/RequestId'
  /auth/companies:
    get:
      tags:
      - Authentication
      summary: الشركات المصرح بها للمستخدم
      operationId: listAccessibleCompanies
      responses:
        '200':
          description: نجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyAccessList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - SessionCookie: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
  /auth/me:
    get:
      tags:
      - Authentication
      summary: هوية الجلسة وسياق الشركة والصلاحيات الفعلية
      description: يعيد سياق التفويض المشتق من الجلسة الحالية فقط. عند اختيار شركة تكون modules هي الموديولات الفعالة بعد حواجز التفعيل والاستحقاقات المؤرخة، وتكون permissions هي تقاطع RBAC مع تلك الموديولات. لا يقبل companyId من العميل ولا يكشف الخطة أو التسعير أو حالة الفوترة، وتستخدم الواجهة النتيجة للعرض بينما يبقى الإنفاذ على الخادم.
      operationId: getCurrentAuthorization
      responses:
        '200':
          description: سياق التفويض الحالي
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentAuthorization'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - SessionCookie: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
  /auth/context:
    put:
      tags:
      - Authentication
      summary: اختيار الشركة الحالية
      operationId: selectCompanyContext
      responses:
        '204':
          description: تم اختيار الشركة الحالية بنجاح
