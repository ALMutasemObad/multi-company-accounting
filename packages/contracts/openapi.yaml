          maxLength: 500
        notes:
          type:
          - string
          - 'null'
          maxLength: 1000
        allocations:
          type: array
          description: عند بقاء السند مرتبطًا بمورد يجب أن تكون غير فارغة ومساوية لمبلغه؛ لا تستخدم مع الحساب المقابل المباشر.
          items:
            $ref: '#/components/schemas/PaymentAllocationInput'
        version:
          type: integer
          minimum: 0
          example: 0
      description: يجوز إغفال حقلي الطرف في التحديث الجزئي؛ وعند إرسالهما يجب أن تنتج القيم المدمجة طرفًا واحدًا فقط من supplierId أو counterAccountId.
    Payment:
      type: object
      required:
      - id
      - document
      - cashBankAccountId
      - paymentMethodId
      - currencyId
      - exchangeRate
      - amount
      - baseAmount
      - realizedFxBaseAmount
      - counterpartyNameSnapshot
      - allocations
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: '1001'
          description: معرّف BIGINT يُنقل كنص لتجنب فقدان الدقة في JavaScript.
        document:
          $ref: '#/components/schemas/AccountingDocumentHeader'
        supplierId:
          oneOf:
          - type: string
            pattern: ^[1-9][0-9]*$
            example: '1001'
            description: معرّف BIGINT يُنقل كنص لتجنب فقدان الدقة في JavaScript.
          - type: 'null'
        counterAccountId:
          oneOf:
          - type: string
            pattern: ^[1-9][0-9]*$
            example: '1001'
            description: معرّف BIGINT يُنقل كنص لتجنب فقدان الدقة في JavaScript.
          - type: 'null'
        cashBankAccountId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: '1001'
          description: معرّف BIGINT يُنقل كنص لتجنب فقدان الدقة في JavaScript.
        paymentMethodId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: '1001'
          description: معرّف BIGINT يُنقل كنص لتجنب فقدان الدقة في JavaScript.
        currencyId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: '1001'
          description: معرّف BIGINT يُنقل كنص لتجنب فقدان الدقة في JavaScript.
        exchangeRate:
          type: string
          pattern: ^[0-9]{1,11}\.[0-9]{8}$
          example: '1.00000000'
          description: سعر صرف DECIMAL(19,8) كنص ويجب أن يكون أكبر من صفر.
        amount:
          type: string
          pattern: ^(0|[1-9][0-9]{0,14})\.[0-9]{4}$
          example: '1250.0000'
          description: قيمة مالية عشرية DECIMAL(19,4) كنص.
        baseAmount:
          type: string
          pattern: ^(0|[1-9][0-9]{0,14})\.[0-9]{4}$
          example: '1250.0000'
          description: قيمة مالية عشرية DECIMAL(19,4) كنص.
        realizedFxBaseAmount:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,14})\.[0-9]{4}$
          description: إجمالي فرق العملة المحقق بعملة الأساس؛ موجب = ربح وسالب = خسارة، وصفر قبل الترحيل أو عند عدم وجود فرق.
        referenceNumber:
          type:
          - string
          - 'null'
        counterpartyNameSnapshot:
          type: string
        counterpartyTaxMasked:
          type:
          - string
          - 'null'
        counterpartyAddressSnapshot:
          type:
          - string
          - 'null'
        notes:
          type:
          - string
          - 'null'
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/PaymentAllocation'
      description: يطبق XOR بين supplierId وcounterAccountId.
