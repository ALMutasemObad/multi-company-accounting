        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /audit-logs/export.csv:
    get:
      tags: [Logs]
      summary: تصدير سجل التدقيق المصفى بصيغة CSV آمنة
      description: يعيد ملف UTF-8 بحد أقصى 10000 سجل ويمنع حقن صيغ جداول البيانات.
      operationId: exportAuditLogs
      x-permission: audit_logs.export
      security:
      - SessionCookie: []
      parameters:
      - name: dateFrom
        in: query
        schema: { type: string, format: date }
      - name: dateTo
        in: query
        schema: { type: string, format: date }
      - name: search
        in: query
        schema: { type: string, maxLength: 200 }
      - name: action
        in: query
        schema: { type: string, maxLength: 120 }
      - name: entityType
        in: query
        schema: { type: string, maxLength: 80 }
      - name: userId
        in: query
        schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: ملف CSV وسجل تدقيق لعملية التصدير
          headers:
            X-Export-Row-Count: { schema: { type: string } }
            X-Export-Truncated: { schema: { type: string, enum: ['true', 'false'] } }
          content:
            text/csv:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /audit-logs/{auditLogId}:
    get:
      tags: [Logs]
      summary: عرض تفاصيل حدث تدقيق داخل الشركة الحالية
      operationId: getAuditLog
      x-permission: audit_logs.view
      security:
      - SessionCookie: []
      parameters:
      - name: auditLogId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: تفاصيل الحدث
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /security-events:
    get:
      tags: [Logs]
      summary: عرض سجل الأمان المصفى داخل الشركة الحالية
      operationId: listSecurityEvents
      x-permission: security_events.view
      security:
      - SessionCookie: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: search
        in: query
        schema: { type: string, maxLength: 200 }
      - name: eventType
        in: query
        schema: { type: string, maxLength: 80 }
      - name: severity
        in: query
        schema: { $ref: '#/components/schemas/SecuritySeverity' }
      - name: userId
        in: query
        schema: { $ref: '#/components/schemas/Id' }
      - name: unacknowledgedOnly
        in: query
        schema: { type: boolean }
      - name: dateFrom
        in: query
        schema: { type: string, format: date }
      - name: dateTo
        in: query
        schema: { type: string, format: date }
      responses:
        '200':
          description: قائمة الأحداث الأمنية
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SecurityEvent' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /security-events/summary:
    get:
      tags: [Logs]
      summary: ملخص تنبيهات الأمان وأحداث آخر 24 ساعة
      operationId: getSecurityEventSummary
      x-permission: security_events.view
      security:
      - SessionCookie: []
      responses:
        '200':
          description: ملخص الأمان
          content:
            application/json:
              schema:
                type: object
                required: [last24Hours, unacknowledgedAlerts, latestCriticalAt]
                properties:
                  last24Hours:
                    type: object
                    required: [info, warning, high, critical]
                    properties:
                      info: { type: integer, minimum: 0 }
                      warning: { type: integer, minimum: 0 }
                      high: { type: integer, minimum: 0 }
                      critical: { type: integer, minimum: 0 }
                  unacknowledgedAlerts: { type: integer, minimum: 0 }
                  latestCriticalAt: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /security-events/options:
    get:
      tags: [Logs]
      summary: خيارات تصفية سجل الأمان
      operationId: getSecurityEventOptions
      x-permission: security_events.view
      security:
      - SessionCookie: []
      responses:
        '200':
          description: خيارات التصفية
          content:
            application/json:
              schema:
                type: object
                required: [eventTypes, users]
                properties:
                  eventTypes: { type: array, items: { type: string } }
                  users:
                    type: array
                    items:
                      type: object
                      required: [id, name, email]
                      properties:
                        id: { $ref: '#/components/schemas/Id' }
                        name: { type: string }
                        email: { type: string, format: email }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /security-events/{securityEventId}/acknowledge:
    post:
      tags: [Logs]
      summary: الإقرار بمراجعة تنبيه أمني
      operationId: acknowledgeSecurityEvent
      x-permission: security_events.acknowledge
      security:
      - SessionCookie: []
        CsrfToken: []
      parameters:
      - name: securityEventId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: الحدث بعد الإقرار
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityEvent' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: sid
      description: معرف جلسة عشوائي؛ القيمة الخام لا تُخزن في قاعدة البيانات.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: رمز Synchronizer مرتبط بالجلسة ومطلوب لكل طلب يغير الحالة.
    MetricsBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: رمز مستقل وطويل من مدير الأسرار، مخصص حصراً لكاشط القياسات التشغيلية.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    PlatformBillingPageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 25
        default: 10
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 200
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID أو قيمة عشوائية فريدة للعملية. تُخزن النتيجة 24 ساعة افتراضياً.
      schema:
        type: string
        minLength: 16
        maxLength: 100
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
  responses:
    ValidationError:
      description: خطأ في التنسيق أو الحقول
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: الجلسة مفقودة أو منتهية أو ملغاة
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: لا توجد صلاحية أو سياق الشركة غير مصرح به
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: الكيان غير موجود داخل الشركة الحالية؛ لا يكشف وجوده في شركة أخرى
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: تعارض إصدار أو تزامن أو تكرار
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    BusinessRuleViolation:
      description: انتهاك قاعدة أعمال، مثل فترة مغلقة أو قيد غير متوازن
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    PaymentProviderUnavailable:
      description: مزود الدفع المركب غير متاح أو رفض تنفيذ العملية مؤقتًا
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: تم تجاوز معدل الطلبات
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimitUnavailable:
      description: تعذر تطبيق الحماية المشتركة من إساءة الاستخدام؛ يفشل المسار الحساس مغلقًا
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    RegistrationUnavailable:
      description: تعذر تطبيق الحماية المشتركة من إساءة الاستخدام أو تعذر تجهيز التسجيل مؤقتًا؛ يمكن إعادة الطلب بأمان
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: خطأ داخلي؛ يعاد requestId فقط دون تفاصيل حساسة
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ConcurrencyRetryExhausted:
      description: استنفدت إعادة المحاولة المحدودة لتعارض قاعدة بيانات مؤقت
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    RequestDeadlineExceeded:
      description: انتهت المهلة الموحدة للعملية قبل إمكان إكمالها بأمان
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    DataImportType:
      type: string
      enum: [CUSTOMERS, SUPPLIERS, SALES_INVOICES, PURCHASE_INVOICES]
    DataImportFormat:
      type: string
      enum: [CSV, XLSX]
    DataImportStatus:
      type: string
      enum: [PREVIEWED, COMMITTED, EXPIRED]
    DataImportFileRequest:
      type: object
      additionalProperties: false
      required: [importType, sourceFormat, contentBase64]
      properties:
        importType: { $ref: '#/components/schemas/DataImportType' }
        sourceFormat: { $ref: '#/components/schemas/DataImportFormat' }
        contentBase64:
          type: string
          minLength: 4
          maxLength: 720000
          pattern: '^[A-Za-z0-9+/]+={0,2}$'
    DataImportBatch:
      type: object
      additionalProperties: false
      required: [id, importType, sourceFormat, rowCount, validRowCount, errorRowCount, status, expiresAt, committedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        importType: { $ref: '#/components/schemas/DataImportType' }
        sourceFormat: { $ref: '#/components/schemas/DataImportFormat' }
        rowCount: { type: integer, minimum: 1, maximum: 500 }
        validRowCount: { type: integer, minimum: 0, maximum: 500 }
        errorRowCount: { type: integer, minimum: 0, maximum: 500 }
        status: { $ref: '#/components/schemas/DataImportStatus' }
        expiresAt: { type: string, format: date-time }
        committedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    DataImportRowError:
      type: object
      additionalProperties: false
      required: [row, column, code]
      properties:
        row: { type: integer, minimum: 1, maximum: 501 }
        column: { type: string, minLength: 1, maxLength: 80 }
        code: { type: string, minLength: 1, maxLength: 80 }
    DataImportPreview:
      type: object
      additionalProperties: false
      required: [batch, errors]
      properties:
        batch: { $ref: '#/components/schemas/DataImportBatch' }
        errors:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/DataImportRowError' }
    DataImportCommitResult:
      type: object
      additionalProperties: false
      required: [batchId, status, createdCount, createdIds, requestId]
      properties:
        batchId: { type: string, format: uuid }
        status: { type: string, const: COMMITTED }
        createdCount: { type: integer, minimum: 1, maximum: 500 }
        createdIds:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/Id' }
        requestId: { type: string, format: uuid }
    Id:
      type: string
      pattern: ^[1-9][0-9]*$
      example: '1001'
      description: معرّف BIGINT يُنقل كنص لتجنب فقدان الدقة في JavaScript.
    Amount:
      type: string
      pattern: ^(0|[1-9][0-9]{0,14})\.[0-9]{4}$
      example: '1250.0000'
      description: قيمة مالية عشرية DECIMAL(19,4) كنص.
    PaginationMeta:
      type: object
      required:
      - page
      - pageSize
      - total
      - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    Problem:
      type: object
      required:
      - code
      description: غلاف خطأ متوافق؛ code ثابت، بينما تضيف الحدود الأحدث messageAr وrequestId وتبقى حقول title/status/reason/errors القديمة مقبولة حتى اكتمال توحيدها.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Z][A-Z0-9_]*$
        messageAr:
          type: string
        requestId:
          type: string
          format: uuid
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        details:
          type: object
          additionalProperties: true
          description: تفاصيل آمنة فقط؛ لا تتضمن SQL أو Stack Trace أو قيماً حساسة.
    HealthResponse:
      type: object
      required:
      - status
      - service
      properties:
        status:
          type: string
          enum:
          - ok
          - error
        service:
          type: string
          const: mcap-finance-api
        checks:
          type: object
          additionalProperties: false
          required: [database]
          properties:
            database: { type: string, enum: [ok, error] }
            latencyMs: { type: number, minimum: 0 }
    CsrfTokenResponse:
      type: object
      required:
      - csrfToken
      properties:
        csrfToken:
          type: string
          minLength: 32
        expiresAt:
          type: string
          format: date-time
          example: '2026-07-30T06:00:00.000Z'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 1024
    PasswordResetStartRequest:
      type: object
      additionalProperties: false
      required: [email, locale]
      properties:
        email: { type: string, format: email, maxLength: 320, x-trim: true }
        locale: { type: string, enum: [ar, en, ur, hi] }
    PasswordResetCompleteRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { type: string, minLength: 32, maxLength: 200, pattern: '^[A-Za-z0-9_-]+$' }
        password: { type: string, minLength: 12, maxLength: 1024 }
    PasswordResetAcceptedResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ACCEPTED] }
    RegistrationStartRequest:
      type: object
      additionalProperties: false
      required: [email, password, displayName, organizationName, companyName, timezone, baseCurrencyCode, locale, chartTemplateCode]
      properties:
        email: { type: string, format: email, maxLength: 320, x-trim: true }
        password: { type: string, minLength: 12, maxLength: 1024 }
        displayName: { type: string, minLength: 1, maxLength: 160, x-trim: true }
        organizationName: { type: string, minLength: 1, maxLength: 200, x-trim: true }
        companyName: { type: string, minLength: 1, maxLength: 200, x-trim: true }
        timezone: { type: string, minLength: 1, maxLength: 64, x-trim: true }
        baseCurrencyCode: { type: string, pattern: '^[A-Z]{3}$', x-trim: true }
        locale: { type: string, enum: [ar, en, ur, hi] }
        chartTemplateCode: { type: string, minLength: 1, maxLength: 80, x-trim: true }
    RegistrationResendRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 320, x-trim: true }
    RegistrationVerifyRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 32, maxLength: 200, pattern: '^[A-Za-z0-9_-]+$' }
    RegistrationPendingResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [PENDING_VERIFICATION] }
    RegistrationCompletedResponse:
      type: object
      additionalProperties: false
      required: [status, companyId, userId]
      properties:
        status: { type: string, enum: [COMPLETED] }
        companyId: { type: string, pattern: '^[1-9][0-9]*$' }
        userId: { type: string, pattern: '^[1-9][0-9]*$' }
    RegistrationInProgressResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [IN_PROGRESS] }
    RegistrationOptionsResponse:
      type: object
      additionalProperties: false
      required: [currencies, locales, timezones, chartTemplates, passwordPolicy]
      properties:
        currencies:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, nameAr, decimals]
            properties:
              code: { type: string, pattern: '^[A-Z]{3}$' }
              nameAr: { type: string }
              decimals: { type: integer, minimum: 0, maximum: 6 }
        locales:
          type: array
          items: { type: string, enum: [ar, en, ur, hi] }
        timezones:
          type: array
          items: { type: string }
        chartTemplates:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, nameAr, nameEn]
            properties:
              code: { type: string }
              nameAr: { type: string }
              nameEn: { type: string }
        passwordPolicy:
          type: object
          additionalProperties: false
          required: [minLength, maxLength]
          properties:
            minLength: { type: integer }
            maxLength: { type: integer }
    SelectCompanyRequest:
      type: object
      additionalProperties: false
      required:
      - companyId
      properties:
        companyId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: '1001'
          description: معرّف BIGINT يُنقل كنص لتجنب فقدان الدقة في JavaScript.
    CompanyAccess:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - timezone
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: '1001'
          description: معرّف BIGINT يُنقل كنص لتجنب فقدان الدقة في JavaScript.
        name:
          type: string
        timezone:
          type: string
    CompanyAccessList:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CompanyAccess'
    AuthenticatedUser:
      type: object
      additionalProperties: false
      required:
      - id
      - displayName
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: '1001'
          description: معرّف BIGINT يُنقل كنص لتجنب فقدان الدقة في JavaScript.
        displayName:
          type: string
    CurrentAuthorization:
      type: object
      additionalProperties: false
      required:
      - user
      - selectedCompany
      - modules
      - permissions
      properties:
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
        selectedCompany:
          oneOf:
          - $ref: '#/components/schemas/CompanyAccess'
          - type: 'null'
        modules:
          type: array
          description: رموز الموديولات الفعالة للشركة المختارة بعد التفعيل والاستحقاقات المؤرخة. تكون فارغة قبل اختيار شركة أو عند غياب الاشتراك.
          uniqueItems: true
          items:
            type: string
            enum:
            - CORE_ACCOUNTING
            - SALES
            - PURCHASES
            - TREASURY
            - INVENTORY
            - POS
            - REPORTING
            - DATA_IMPORT
            - APPROVALS
            - PROFESSIONAL_PROJECTS
            - HUMAN_RESOURCES
            - TAX
            - CRM
            - SERVICE_CATALOG
        permissions:
          type: array
          description: صلاحيات RBAC الفعلية بعد تقاطعها مع الموديولات الفعالة؛ لا تُعد بديلًا عن إنفاذ الخادم.
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z][a-z0-9_]*(?:\.[a-z][a-z0-9_]*)+$
    AuthSessionResponse:
      type: object
      required:
      - user
      - csrfToken
      - expiresAt
      properties:
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
        csrfToken:
          type: string
          minLength: 32
        expiresAt:
          type: string
          format: date-time
          example: '2026-07-30T06:00:00.000Z'
    Session:
      type: object
      required:
      - id
      - createdAt
      - lastActivityAt
      - expiresAt
      - current
      - revoked
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: '1001'
          description: معرّف BIGINT يُنقل كنص لتجنب فقدان الدقة في JavaScript.
        createdAt:
          type: string
          format: date-time
          example: '2026-07-30T06:00:00.000Z'
        lastActivityAt:
          type: string
          format: date-time
          example: '2026-07-30T06:00:00.000Z'
        expiresAt:
          type: string
          format: date-time
          example: '2026-07-30T06:00:00.000Z'
        revokedAt:
          oneOf:
          - type: string
            format: date-time
