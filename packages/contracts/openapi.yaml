              counterpartyName: { type: string }
              amount: { $ref: '#/components/schemas/Amount' }
    AuditLog:
      type: object
      required:
      - id
      - actor
      - action
      - entityType
      - entityId
      - createdAt
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: '1001'
          description: معرّف BIGINT يُنقل كنص لتجنب فقدان الدقة في JavaScript.
        actor:
          type: object
          required: [id, name, email]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            name: { type: string }
            email: { type: string, format: email }
        action:
          type: string
        entityType:
          type: string
        entityId: { type: string }
        details:
          oneOf:
          - type: object
            additionalProperties: true
          - type: 'null'
        createdAt:
          type: string
          format: date-time
          example: '2026-07-30T06:00:00.000Z'
    SecuritySeverity:
      type: string
      enum:
      - INFO
      - WARNING
      - HIGH
      - CRITICAL
    SecurityEvent:
      type: object
      required:
      - id
      - eventType
      - severity
      - user
      - email
      - ipAddress
      - userAgent
      - details
      - sessionId
      - createdAt
      - acknowledgedAt
      - acknowledgedBy
      properties:
        id: { $ref: '#/components/schemas/Id' }
