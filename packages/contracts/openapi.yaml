        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: sid
      description: معرف جلسة عشوائي؛ القيمة الخام لا تُخزن في قاعدة البيانات.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: رمز Synchronizer مرتبط بالجلسة ومطلوب لكل طلب يغير الحالة.
    MetricsBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: رمز مستقل وطويل من مدير الأسرار، مخصص حصراً لكاشط القياسات التشغيلية.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 200
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID أو قيمة عشوائية فريدة للعملية. تُخزن النتيجة 24 ساعة افتراضياً.
      schema:
        type: string
        minLength: 16
        maxLength: 100
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
  responses:
    ValidationError:
      description: خطأ في التنسيق أو الحقول
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: الجلسة مفقودة أو منتهية أو ملغاة
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: لا توجد صلاحية أو سياق الشركة غير مصرح به
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: الكيان غير موجود داخل الشركة الحالية؛ لا يكشف وجوده في شركة أخرى
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: تعارض إصدار أو تزامن أو تكرار
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    BusinessRuleViolation:
      description: انتهاك قاعدة أعمال، مثل فترة مغلقة أو قيد غير متوازن
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: تم تجاوز معدل الطلبات
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: خطأ داخلي؛ يعاد requestId فقط دون تفاصيل حساسة
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ConcurrencyRetryExhausted:
      description: استنفدت إعادة المحاولة المحدودة لتعارض قاعدة بيانات مؤقت
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    RequestDeadlineExceeded:
      description: انتهت المهلة الموحدة للعملية قبل إمكان إكمالها بأمان
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    DataImportType:
      type: string
      enum: [CUSTOMERS, SUPPLIERS, SALES_INVOICES, PURCHASE_INVOICES]
    DataImportFormat:
      type: string
      enum: [CSV, XLSX]
    DataImportStatus:
      type: string
      enum: [PREVIEWED, COMMITTED, EXPIRED]
    DataImportFileRequest:
      type: object
      additionalProperties: false
      required: [importType, sourceFormat, contentBase64]
      properties:
        importType: { $ref: '#/components/schemas/DataImportType' }
        sourceFormat: { $ref: '#/components/schemas/DataImportFormat' }
        contentBase64:
          type: string
          minLength: 4
          maxLength: 720000
          pattern: '^[A-Za-z0-9+/]+={0,2}$'
    DataImportBatch:
      type: object
      additionalProperties: false
      required: [id, importType, sourceFormat, rowCount, validRowCount, errorRowCount, status, expiresAt, committedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        importType: { $ref: '#/components/schemas/DataImportType' }
        sourceFormat: { $ref: '#/components/schemas/DataImportFormat' }
        rowCount: { type: integer, minimum: 1, maximum: 500 }
        validRowCount: { type: integer, minimum: 0, maximum: 500 }
        errorRowCount: { type: integer, minimum: 0, maximum: 500 }
        status: { $ref: '#/components/schemas/DataImportStatus' }
        expiresAt: { type: string, format: date-time }
        committedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    DataImportRowError:
      type: object
      additionalProperties: false
      required: [row, column, code]
      properties:
        row: { type: integer, minimum: 1, maximum: 501 }
        column: { type: string, minLength: 1, maxLength: 80 }
        code: { type: string, minLength: 1, maxLength: 80 }
    DataImportPreview:
      type: object
      additionalProperties: false
      required: [batch, errors]
      properties:
        batch: { $ref: '#/components/schemas/DataImportBatch' }
        errors:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/DataImportRowError' }
    DataImportCommitResult:
      type: object
      additionalProperties: false
      required: [batchId, status, createdCount, createdIds, requestId]
      properties:
        batchId: { type: string, format: uuid }
        status: { type: string, const: COMMITTED }
        createdCount: { type: integer, minimum: 1, maximum: 500 }
        createdIds:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/Id' }
        requestId: { type: string, format: uuid }
    Id:
      type: string
      pattern: ^[1-9][0-9]*$
      example: '1001'
      description: معرّف BIGINT يُنقل كنص لتجنب فقدان الدقة في JavaScript.
    Amount:
      type: string
      pattern: ^(0|[1-9][0-9]{0,14})\.[0-9]{4}$
      example: '1250.0000'
      description: قيمة مالية عشرية DECIMAL(19,4) كنص.
    PaginationMeta:
      type: object
      required:
      - page
      - pageSize
      - total
      - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    Problem:
      type: object
      required:
      - code
      description: غلاف خطأ متوافق؛ code ثابت، بينما تضيف الحدود الأحدث messageAr وrequestId وتبقى حقول title/status/reason/errors القديمة مقبولة حتى اكتمال توحيدها.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Z][A-Z0-9_]*$
        messageAr:
          type: string
        requestId:
          type: string
          format: uuid
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        details:
          type: object
          additionalProperties: true
          description: تفاصيل آمنة فقط؛ لا تتضمن SQL أو Stack Trace أو قيماً حساسة.
    HealthResponse:
      type: object
      required:
      - status
      - service
      properties:
        status:
          type: string
          enum:
          - ok
          - error
        service:
          type: string
          const: mcap-finance-api
        checks:
          type: object
          additionalProperties:
            type: string
    CsrfTokenResponse:
      type: object
      required:
      - csrfToken
      properties:
        csrfToken:
          type: string
          minLength: 32
        expiresAt:
          type: string
          format: date-time
          example: '2026-07-30T06:00:00.000Z'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 1024
    PasswordResetStartRequest:
      type: object
      additionalProperties: false
      required: [email, locale]
      properties:
        email: { type: string, format: email, maxLength: 320, x-trim: true }
        locale: { type: string, enum: [ar, en, ur, hi] }
    PasswordResetCompleteRequest:
      type: object
