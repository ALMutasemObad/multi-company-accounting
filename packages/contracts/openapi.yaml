  /platform/electronic-payments:
    get:
      tags: [Platform Operations]
      summary: دفعات الاشتراكات الإلكترونية لجميع الشركات
      description: قراءة تشغيلية عابرة للشركات لمشغل منصة مدرج في قائمة السماح المستقلة، مع تصفية وصفحات منفذة في قاعدة البيانات.
      operationId: listPlatformElectronicPayments
      security: [{ SessionCookie: [] }]
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PlatformBillingPageSize'
      - name: companyId
        in: query
        required: false
        description: حصر النتائج في شركة واحدة؛ لا يمنح هذا المعرف أي صلاحية بحد ذاته.
        schema: { type: string, pattern: '^[1-9][0-9]*$' }
      - name: state
        in: query
        required: false
        schema:
          type: string
          enum: [ALL, CHECKOUT, PENDING, PAID, FAILED, CANCELLED, REFUNDED]
          default: ALL
      responses:
        '200':
          description: صفحة دفعات مع اسم الشركة عند توفره
          content: { application/json: { schema: { $ref: '#/components/schemas/PlatformElectronicPaymentPage' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /platform/electronic-payments/{paymentId}/refund:
    post:
      tags: [Platform Operations]
      summary: طلب استرداد كامل لدفعة اشتراك إلكترونية
      description: للمشغل فقط. الاسترداد كامل وغير جزئي، ولا يغير حالة الاشتراك مباشرة، ويحمي version من فقد التحديث وIdempotency-Key من التكرار.
      operationId: refundPlatformPayment
      security: [{ SessionCookie: [], CsrfToken: [] }]
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: paymentId
        in: path
        required: true
        schema: { type: string, format: uuid }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PlatformElectronicPaymentRefundRequest' } } }
      responses:
        '202':
          description: حُجز طلب الاسترداد أو أعيدت نتيجته المتكررة
          content: { application/json: { schema: { $ref: '#/components/schemas/PlatformElectronicPaymentRefundResult' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/PaymentProviderUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /platform/payment-webhooks/{providerCode}:
    post:
      tags: [Platform Operations]
      summary: استقبال webhook خام موقّع من مزود الدفع
      description: >-
        مسار شبكي بلا جلسة. يجب إرسال Content-Type application/json، ويحتفظ الخادم بالبايتات الخام حتى يتحقق من
        X-Platform-Payment-Signature قبل تحليل JSON. لا تُخزن الحمولة؛ تُخزن بصمة SHA-256 فقط. مفتاح الحدث المكرر
        مع الحمولة نفسها يعيد نتيجة آمنة، أما الحمولة المختلفة للمفتاح نفسه فتُرفض بتعارض.
      operationId: receivePlatformPaymentWebhook
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: providerCode
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z0-9_-]{1,64}$' }
      - name: X-Platform-Payment-Signature
        in: header
        required: true
        description: توقيع HMAC للـadapter الحالي بصيغة timestamp/signature؛ يُتحقق منه على البايتات الخام ضمن نافذة زمنية محدودة.
        schema: { type: string, pattern: '^t=[0-9]{1,12},v1=[a-f0-9]{64}$' }
      requestBody:
        required: true
        description: حمولة JSON الخام للـadapter. application/* مستخدمة كي تبقى المعالجة الخام خارج حراس JSON المولدة؛ النوع الفعلي المقبول هو application/json فقط.
        content:
          application/*:
            schema: { $ref: '#/components/schemas/DevelopmentPlatformPaymentWebhookPayload' }
      responses:
        '202':
          description: قُبل الحدث للمعالجة، بما في ذلك التكرار المطابق والحدث غير القابل للتسوية
          content: { application/json: { schema: { $ref: '#/components/schemas/PlatformPaymentWebhookResult' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: التوقيع مفقود أو غير صالح أو قديم، أو أن الحمولة لا تطابق عقد المزود
          content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/PaymentProviderUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /platform/subscription-modules:
    get:
      tags: [Platform Subscriptions]
      summary: وحدات المنصة واعتمادياتها لإدارة كتالوج الخطط
      operationId: listPlatformSubscriptionModules
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      responses:
        '200': { description: الوحدات, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformSubscriptionModulesResponse' } } } }
