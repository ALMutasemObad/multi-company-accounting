name: dependency-security-monitor

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-monitor
  cancel-in-progress: false

jobs:
  audit:
    name: Audit locked build and production dependencies
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Pin the package manager
        run: npm install --global npm@12.0.2
      - name: Install the locked dependency graph
        run: npm ci
      - name: Reject unapproved dependency install scripts
        run: npm run audit:install-scripts
      - name: Block critical build dependency vulnerabilities
        run: npm run audit:critical
      - name: Remove build-only and optional dependencies
        run: npm prune --omit=dev --omit=optional
      - name: Block high production dependency vulnerabilities
        run: npm run audit:production
