name: production-metrics-monitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: Emit a synthetic monitoring alert after a successful scrape
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: production-metrics-monitor
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape production metrics and surface alerts
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment:
      name: production
      url: https://accounting.doralashab.com
    env:
      APP_URL: https://accounting.doralashab.com
    steps:
      - name: Verify protected metrics and operational alerts
        env:
          METRICS_BEARER_TOKEN: ${{ secrets.METRICS_BEARER_TOKEN }}
          TEST_ALERT: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert || false }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${#METRICS_BEARER_TOKEN}" -ge 32
          test "${#METRICS_BEARER_TOKEN}" -le 500
          unauthenticated_status=$(curl --silent --show-error --max-time 10 \
            --proto '=https' --output /dev/null --write-out '%{http_code}' \
            "$APP_URL/metrics")
          test "$unauthenticated_status" = 401

          metrics_output=$(mktemp)
          trap 'rm -f -- "$metrics_output"' EXIT
          curl --fail --silent --show-error --max-time 10 --proto '=https' \
            --header "Authorization: Bearer $METRICS_BEARER_TOKEN" \
            --output "$metrics_output" "$APP_URL/metrics"
          grep --fixed-strings '# TYPE mcap_operational_alert_active gauge' "$metrics_output"
          grep --fixed-strings '# TYPE mcap_operational_alert_last_fired_timestamp_seconds gauge' "$metrics_output"

          node - "$metrics_output" <<'NODE'
          const fs = require('node:fs');
          const input = fs.readFileSync(process.argv[2], 'utf8');
          const recentCutoffSeconds = Math.floor(Date.now() / 1_000) - 3_900;
          const alerts = new Set();
          for (const line of input.split('\n')) {
            const active = line.match(/^mcap_operational_alert_active\{alert="([A-Z0-9_]+)"\} 1$/u);
            if (active) alerts.add(active[1]);
            const lastFired = line.match(/^mcap_operational_alert_last_fired_timestamp_seconds\{alert="([A-Z0-9_]+)"\} ([0-9]+(?:\.[0-9]+)?)$/u);
            if (lastFired && Number(lastFired[2]) >= recentCutoffSeconds) alerts.add(lastFired[1]);
          }
          if (alerts.size) {
            for (const alert of [...alerts].sort()) {
              console.error(`::error title=Production operational alert::${alert}`);
            }
            process.exit(1);
          }
          NODE

          if [[ "$TEST_ALERT" == true ]]; then
            printf '::error title=Production monitoring test alert::Synthetic delivery test after a successful authenticated scrape\n'
            exit 1
          fi
      - name: Verify offsite backup and restore evidence freshness
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_BACKUP_ARTIFACT_AGE_SECONDS: '91800'
          MAX_RESTORE_DRILL_AGE_SECONDS: '3024000'
        shell: bash
        run: |
          set -Eeuo pipefail
          backup_artifacts_json=$(mktemp)
          restore_artifacts_json=$(mktemp)
          restore_failure_artifacts_json=$(mktemp)
          workflow_runs_json=$(mktemp)
          trap 'rm -f -- "$backup_artifacts_json" "$restore_artifacts_json" "$restore_failure_artifacts_json" "$workflow_runs_json"' EXIT
          gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=mcap-production-database-backup&per_page=100" \
            > "$backup_artifacts_json"
          gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=mcap-production-restore-drill&per_page=100" \
            > "$restore_artifacts_json"
          gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=mcap-production-restore-drill-failure&per_page=100" \
            > "$restore_failure_artifacts_json"
          gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/production-backup-dr.yml/runs?branch=main&exclude_pull_requests=true&per_page=100" \
            > "$workflow_runs_json"
          node - "$backup_artifacts_json" "$restore_artifacts_json" "$restore_failure_artifacts_json" "$workflow_runs_json" \
            "$MAX_BACKUP_ARTIFACT_AGE_SECONDS" "$MAX_RESTORE_DRILL_AGE_SECONDS" <<'NODE'
          const fs = require('node:fs');
          const [backupFile, restoreFile, failureFile, runsFile, maxBackupAgeText, maxRestoreAgeText] = process.argv.slice(2);
          const backupPayload = JSON.parse(fs.readFileSync(backupFile, 'utf8'));
          const restorePayload = JSON.parse(fs.readFileSync(restoreFile, 'utf8'));
          const failurePayload = JSON.parse(fs.readFileSync(failureFile, 'utf8'));
          const runs = JSON.parse(fs.readFileSync(runsFile, 'utf8'));
          const flattenArtifacts = (payload) => (Array.isArray(payload) ? payload : [payload])
            .flatMap((page) => page.artifacts || []);
          const workflowRuns = (Array.isArray(runs) ? runs : [runs])
            .flatMap((page) => page.workflow_runs || []);
          const trustedRunIds = new Set(workflowRuns
            .filter((run) => run.head_branch === 'main')
            .map((run) => run.id));
          const latestTrusted = (payload, name) => flattenArtifacts(payload)
            .filter((artifact) =>
              !artifact.expired &&
              artifact.name === name &&
              trustedRunIds.has(artifact.workflow_run?.id))
            .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at))[0];
          const ageSeconds = (artifact) => Math.max(
            0,
            Math.floor((Date.now() - Date.parse(artifact.created_at)) / 1000),
          );
          let failed = false;
          const latestBackup = latestTrusted(backupPayload, 'mcap-production-database-backup');
          if (!latestBackup) {
            console.error('::error title=Production backup missing::No retained encrypted offsite recovery point exists.');
            failed = true;
          } else {
            const backupAge = ageSeconds(latestBackup);
            const maxBackupAge = Number(maxBackupAgeText);
            if (!Number.isFinite(backupAge) || backupAge > maxBackupAge) {
              console.error(`::error title=Production backup stale::Latest trusted offsite artifact age ${backupAge}s exceeds ${maxBackupAge}s.`);
              failed = true;
            } else {
              console.log(`Latest trusted offsite backup artifact age: ${backupAge}s.`);
            }
          }
          const latestRestore = latestTrusted(restorePayload, 'mcap-production-restore-drill');
          const latestRestoreFailure = latestTrusted(
            failurePayload,
            'mcap-production-restore-drill-failure',
          );
          if (!latestRestore) {
            console.error('::error title=Production restore drill missing::No retained successful production restore evidence exists.');
            failed = true;
          } else {
            const restoreAge = ageSeconds(latestRestore);
            const maxRestoreAge = Number(maxRestoreAgeText);
            if (!Number.isFinite(restoreAge) || restoreAge > maxRestoreAge) {
              console.error(`::error title=Production restore drill stale::Latest successful drill evidence age ${restoreAge}s exceeds ${maxRestoreAge}s.`);
              failed = true;
            } else {
              console.log(`Latest successful production restore drill evidence age: ${restoreAge}s.`);
            }
          }
          if (
            latestRestoreFailure &&
            (!latestRestore || Date.parse(latestRestoreFailure.created_at) > Date.parse(latestRestore.created_at))
          ) {
            console.error('::error title=Production restore drill failed::A required restore drill failed after the latest successful drill.');
            failed = true;
          }
          if (failed) process.exit(1);
          NODE
