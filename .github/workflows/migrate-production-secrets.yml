name: migrate-production-secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Copy repository deployment secrets to production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Copy secrets without exposing their values
        env:
          GH_TOKEN: ${{ secrets.P0_2_ENVIRONMENT_SECRET_MIGRATION_TOKEN }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          test -n "$CPANEL_SSH_PRIVATE_KEY"
          test -n "$BACKUP_ENCRYPTION_PASSPHRASE"

          printf '%s' "$CPANEL_SSH_PRIVATE_KEY" |
            gh secret set CPANEL_SSH_PRIVATE_KEY \
              --env production \
              --repo "$GITHUB_REPOSITORY"
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" |
            gh secret set BACKUP_ENCRYPTION_PASSPHRASE \
              --env production \
              --repo "$GITHUB_REPOSITORY"

      - name: Verify both environment secret records exist
        env:
          GH_TOKEN: ${{ secrets.P0_2_ENVIRONMENT_SECRET_MIGRATION_TOKEN }}
        run: |
          set -Eeuo pipefail
          secret_names=$(gh secret list \
            --env production \
            --repo "$GITHUB_REPOSITORY" \
            --json name \
            --jq '.[].name')
          grep -Fxq 'CPANEL_SSH_PRIVATE_KEY' <<<"$secret_names"
          grep -Fxq 'BACKUP_ENCRYPTION_PASSPHRASE' <<<"$secret_names"
          printf 'Verified both production environment secret records.\n'
