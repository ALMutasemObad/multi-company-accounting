name: production-passenger-post-recovery-diagnostics

on:
  push:
    branches:
      - ops/passenger-post-recovery

permissions:
  contents: read

concurrency:
  group: production-passenger-post-recovery-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    name: Read sanitized Passenger startup diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      CPANEL_SSH_HOST: sv13.byethost13.org
      CPANEL_SSH_PORT: '1394'
      CPANEL_SSH_USER: doralash
    steps:
      - uses: actions/checkout@v4
      - name: Configure the pinned production SSH identity
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
        run: |
          test -n "$CPANEL_SSH_PRIVATE_KEY"
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          install -m 0600 deploy/ssh/ifastnet_known_hosts "$HOME/.ssh/known_hosts"
      - name: Read sanitized startup state and Passenger log
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -p "$CPANEL_SSH_PORT" -o IdentitiesOnly=yes \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" bash -s <<'REMOTE'
          set -Eeuo pipefail
          deploy_root=/home/doralash/accounting-app
          passenger_config=/home/doralash/accounting.doralashab.com/.htaccess
          passenger_log=/home/doralash/logs/accounting-passenger.log

          printf '%s\n' '=== release links ==='
          for link in "$deploy_root/current" "$deploy_root/previous"; do
            if [[ -L "$link" ]]; then
              printf '%s -> %s\n' "$link" "$(readlink -f -- "$link")"
            else
              printf '%s is not a symlink\n' "$link"
            fi
          done

          printf '%s\n' '=== current release manifest ==='
          current_release=$(readlink -f -- "$deploy_root/current")
          node -e '
            const fs = require("node:fs");
            const path = process.argv[1];
            const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
            console.log(JSON.stringify({
              releaseId: manifest.releaseId,
              version: manifest.version,
              commit: manifest.commit,
              platform: manifest.platform,
              architecture: manifest.architecture
            }));
          ' "$current_release/release-manifest.json"

          printf '%s\n' '=== sanitized cPanel Passenger application registry ==='
          uapi_bin=/usr/local/cpanel/bin/uapi
          if [[ -x "$uapi_bin" ]]; then
            uapi_result=$(mktemp /tmp/mcap-passenger-apps.XXXXXX)
            trap 'rm -f -- "$uapi_result"' EXIT
            "$uapi_bin" --output=json PassengerApps list_applications > "$uapi_result"
            node -e '
              const fs = require("node:fs");
              const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const result = payload.result || {};
              const data = result.data;
              const allowed = new Set(["name", "domain", "path", "base_uri", "deployment_mode", "enabled", "nodejs_version", "startup_file"]);
              const applications = [];
              if (Array.isArray(data)) {
                for (const item of data) {
                  const summary = {};
                  if (item && typeof item === "object") for (const key of allowed) if (key in item) summary[key] = item[key];
                  applications.push(summary);
                }
              } else if (data && typeof data === "object") {
                for (const [registryKey, item] of Object.entries(data)) {
                  const summary = { registry_key: registryKey };
                  if (item && typeof item === "object") for (const key of allowed) if (key in item) summary[key] = item[key];
                  applications.push(summary);
                }
              }
              console.log(JSON.stringify({ status: result.status, errors: result.errors, application_count: applications.length, applications }));
            ' "$uapi_result"
          else
            printf '%s\n' 'cPanel UAPI is unavailable'
          fi
          printf '%s\n' '=== sanitized CloudLinux Node.js Selector registry ==='
          selector_bin=/usr/bin/cloudlinux-selector
          if [[ -x "$selector_bin" ]]; then
            selector_result=$(mktemp /tmp/mcap-node-selector.XXXXXX)
            selector_error=$(mktemp /tmp/mcap-node-selector-error.XXXXXX)
            trap 'rm -f -- "${uapi_result:-}" "$selector_result" "$selector_error"' EXIT
            if "$selector_bin" get --json --interpreter nodejs --user doralash > "$selector_result" 2> "$selector_error"; then
              node -e '
                const fs = require("node:fs");
                const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                const applications = [];
                for (const [version, versionData] of Object.entries(payload.available_versions || {})) {
                  for (const [user, userData] of Object.entries(versionData.users || {})) {
                    for (const [appRoot, app] of Object.entries(userData.applications || {})) {
                      applications.push({
                        version, user, app_root: appRoot, domain: app.domain, app_uri: app.app_uri,
                        app_mode: app.app_mode, startup_file: app.startup_file, app_status: app.app_status,
                        env_var_names: Object.keys(app.env_vars || {}).sort()
                      });
                    }
                  }
                }
                console.log(JSON.stringify({ result: payload.result, selector_enabled: payload.selector_enabled, application_count: applications.length, applications }));
              ' "$selector_result"
            else
              printf 'cloudlinux-selector failed: %s\n' "$(tr '\n' ' ' < "$selector_error")"
            fi
          else
            printf '%s\n' 'CloudLinux Node.js Selector CLI is unavailable'
          fi
          printf '%s\n' '=== available application control commands ==='
          for control_command in cloudlinux-selector selectorctl passenger-config passenger-status uapi; do
            control_path=$(command -v -- "$control_command" || true)
            printf '%s=%s\n' "$control_command" "${control_path:-unavailable}"
          done
          printf '%s\n' '=== Passenger configuration keys ==='
          awk '
            $1 == "SetEnv" { print "SetEnv " $2 " [redacted]"; next }
            $1 == "PassengerAppRoot" { print $1 " " $2; next }
            $1 ~ /^Passenger/ { print $1 " [configured]" }
          ' "$passenger_config"

          printf '%s\n' '=== current Passenger error ID context ==='
          if [[ -f "$passenger_log" ]]; then
            grep -n -B 80 -A 120 -- '55ee3e41' "$passenger_log" |
              sed -E \
                -e 's#(mysql://)[^/@[:space:]]+:[^@[:space:]]+@#\1[redacted]@#g' \
                -e 's/(RESEND_API_KEY|REGISTRATION_TOKEN_SECRET|REGISTRATION_AUDIT_PEPPER|DATABASE_URL)=([^[:space:]]+)/\1=[redacted]/g' \
                -e 's/re_[A-Za-z0-9_-]{16,}/re_[redacted]/g' \
                -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[redacted-email]/g' || true
          fi
          printf '%s\n' '=== sanitized Passenger log tail ==='
          if [[ -f "$passenger_log" ]]; then
            tail -n 500 -- "$passenger_log" |
              sed -E \
                -e 's#(mysql://)[^/@[:space:]]+:[^@[:space:]]+@#\1[redacted]@#g' \
                -e 's/(RESEND_API_KEY|REGISTRATION_TOKEN_SECRET|REGISTRATION_AUDIT_PEPPER|DATABASE_URL)=([^[:space:]]+)/\1=[redacted]/g' \
                -e 's/re_[A-Za-z0-9_-]{16,}/re_[redacted]/g' \
                -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[redacted-email]/g'
          else
            printf '%s\n' 'Passenger log file is missing'
          fi
          REMOTE
