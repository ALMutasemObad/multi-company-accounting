name: production-passenger-loader-recovery

on:
  push:
    branches:
      - ops/passenger-loader-recovery

permissions:
  contents: read

concurrency:
  group: production-passenger-loader-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Force a fresh Passenger app group with protected environment
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: production
    env:
      CPANEL_SSH_HOST: sv13.byethost13.org
      CPANEL_SSH_PORT: '1394'
      CPANEL_SSH_USER: doralash
    steps:
      - uses: actions/checkout@v4
      - name: Configure the pinned production SSH identity
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
        run: |
          test -n "$CPANEL_SSH_PRIVATE_KEY"
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          install -m 0600 deploy/ssh/ifastnet_known_hosts "$HOME/.ssh/known_hosts"
      - name: Install protected startup loader and force a fresh app group
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -p "$CPANEL_SSH_PORT" -o IdentitiesOnly=yes \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" bash -s <<'REMOTE'
          set -Eeuo pipefail

          fail() { printf 'mcap-loader-recovery: %s\n' "$*" >&2; exit 1; }

          deploy_root=/home/doralash/accounting-app
          passenger_config=/home/doralash/accounting.doralashab.com/.htaccess
          passenger_log=/home/doralash/logs/accounting-passenger.log
          environment_file="$deploy_root/shared/passenger.env"
          backup_dir="$deploy_root/recovery-backups"
          live_url=https://accounting.doralashab.com/live
          ready_url=https://accounting.doralashab.com/ready

          [[ "$(id -un)" == doralash ]] || fail "unexpected remote user"
          [[ -d "$deploy_root" && ! -L "$deploy_root" && "$(readlink -f -- "$deploy_root")" == "$deploy_root" ]] \
            || fail "deployment root is invalid"
          [[ -f "$passenger_config" && ! -L "$passenger_config" && "$(readlink -f -- "$passenger_config")" == "$passenger_config" ]] \
            || fail "Passenger configuration is invalid"
          [[ -f "$environment_file" && ! -L "$environment_file" ]] || fail "protected environment file is unavailable"
          [[ -d "$backup_dir" && ! -L "$backup_dir" ]] || fail "recovery backup directory is invalid"

          current_release=$(readlink -f -- "$deploy_root/current") || fail "current release link is unavailable"
          case "$current_release" in
            "$deploy_root/releases/"*) ;;
            *) fail "current release resolved outside the release directory" ;;
          esac
          [[ -f "$current_release/apps/api/dist/server.js" && ! -L "$current_release/apps/api/dist/server.js" ]] \
            || fail "current server entrypoint is invalid"
          [[ -d "$current_release/tmp" && ! -L "$current_release/tmp" ]] || fail "restart directory is invalid"

          node_bin=$(awk '$1 == "PassengerNodejs" { value=$2; gsub(/^"|"$/, "", value); print value; count++ } END { if (count != 1) exit 42 }' "$passenger_config") \
            || fail "PassengerNodejs must be configured exactly once"
          [[ "$node_bin" =~ ^/[A-Za-z0-9_./-]+$ && -x "$node_bin" ]] || fail "configured Node executable is invalid"

          (
            cd -- "$current_release"
            "$node_bin" --env-file="$environment_file" --input-type=module -e '
              const { loadConfig } = await import("./apps/api/dist/config.js");
              const config = loadConfig();
              if (config.NODE_ENV !== "production" || !config.DATABASE_URL || !config.SESSION_COOKIE_SECURE || !config.TRUST_PROXY || !config.WEB_ORIGIN.startsWith("https://")) {
                throw new Error("protected production environment validation failed");
              }
              console.log("Protected production environment validated without revealing values.");
            '
          )

          timestamp=$(date -u +%Y%m%dT%H%M%SZ)
          config_backup="$backup_dir/htaccess-before-loader-$timestamp"
          loader_file="$current_release/passenger-start.cjs"
          loader_backup="$backup_dir/passenger-start-before-$timestamp.cjs"
          [[ ! -e "$config_backup" && ! -L "$config_backup" ]] || fail "configuration backup target already exists"
          cp -p -- "$passenger_config" "$config_backup"

          if [[ -e "$loader_file" || -L "$loader_file" ]]; then
            [[ -f "$loader_file" && ! -L "$loader_file" ]] || fail "existing startup loader path is unsafe"
            cp -p -- "$loader_file" "$loader_backup"
          fi

          umask 077
          loader_candidate=$(mktemp "$current_release/passenger-start.cjs.next.XXXXXX")
          config_candidate=$(mktemp "/home/doralash/accounting.doralashab.com/.htaccess.next.XXXXXX")
          cleanup() { rm -f -- "$loader_candidate" "$config_candidate"; }
          trap cleanup EXIT

          printf '%s\n' \
            "process.loadEnvFile('$environment_file');" \
            "require('./apps/api/dist/server.js');" > "$loader_candidate"
          chmod 0600 -- "$loader_candidate"

          startup_count=$(awk '$1 == "PassengerStartupFile" { count++ } END { print count + 0 }' "$passenger_config")
          [[ "$startup_count" == 1 ]] || fail "PassengerStartupFile must occur exactly once"
          app_group="mcap-recovery-$timestamp"
          awk -v group="$app_group" '
            $1 == "PassengerStartupFile" { print "PassengerStartupFile passenger-start.cjs"; next }
            $1 == "PassengerAppGroupName" { if (!group_written) { print "PassengerAppGroupName " group; group_written=1 }; next }
            { print }
            END { if (!group_written) print "PassengerAppGroupName " group }
          ' "$passenger_config" > "$config_candidate"
          chmod --reference="$passenger_config" -- "$config_candidate"

          mv -- "$loader_candidate" "$loader_file"
          mv -- "$config_candidate" "$passenger_config"
          chmod 0600 -- "$loader_file"
          touch -- "$current_release/tmp/restart.txt" "$passenger_config"

          healthy=false
          for attempt in $(seq 1 12); do
            live_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 2 --max-time 3 "$live_url" || true)
            ready_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 2 --max-time 3 "$ready_url" || true)
            printf 'health attempt %s/12: live=%s ready=%s\n' "$attempt" "${live_status:-000}" "${ready_status:-000}"
            if [[ "$live_status" == 200 && "$ready_status" == 200 ]]; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [[ "$healthy" != true ]]; then
            if [[ -f "$passenger_log" ]]; then
              tail -n 160 -- "$passenger_log" |
                sed -E \
                  -e 's#(mysql://)[^/@[:space:]]+:[^@[:space:]]+@#\1[redacted]@#g' \
                  -e 's/(RESEND_API_KEY|REGISTRATION_TOKEN_SECRET|REGISTRATION_AUDIT_PEPPER|DATABASE_URL)=([^[:space:]]+)/\1=[redacted]/g' \
                  -e 's/re_[A-Za-z0-9_-]{16,}/re_[redacted]/g' \
                  -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[redacted-email]/g'
            fi
            cp -p -- "$config_backup" "$passenger_config"
            if [[ -f "$loader_backup" ]]; then
              cp -p -- "$loader_backup" "$loader_file"
            fi
            touch -- "$current_release/tmp/restart.txt" "$passenger_config"
            fail "health checks failed; the original Passenger configuration was restored from $config_backup"
          fi

          printf 'mcap-loader-recovery: production is healthy on release %s; configuration backup: %s\n' \
            "$(basename -- "$current_release")" "$config_backup"
          REMOTE

