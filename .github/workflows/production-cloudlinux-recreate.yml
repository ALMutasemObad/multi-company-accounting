name: production-cloudlinux-recreate-diagnostic

on:
  push:
    branches:
      - ops/cloudlinux-recreate

permissions:
  contents: read

concurrency:
  group: production-cloudlinux-recreate
  cancel-in-progress: false

jobs:
  diagnose:
    name: Inspect CloudLinux state after the failed recreate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
    env:
      CPANEL_SSH_HOST: sv13.byethost13.org
      CPANEL_SSH_PORT: '1394'
      CPANEL_SSH_USER: doralash
    steps:
      - uses: actions/checkout@v4
      - name: Configure the pinned production SSH identity
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
        run: |
          test -n "$CPANEL_SSH_PRIVATE_KEY"
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          install -m 0600 deploy/ssh/ifastnet_known_hosts "$HOME/.ssh/known_hosts"
      - name: Read the selector registry and command contract
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -p "$CPANEL_SSH_PORT" -o IdentitiesOnly=yes \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" bash -s <<'REMOTE'
          set -Eeuo pipefail
          selector=/usr/sbin/cloudlinux-selector
          snapshot=$(mktemp /tmp/mcap-selector-state.XXXXXX)
          trap 'rm -f -- "$snapshot"' EXIT
          "$selector" get --json --interpreter nodejs --user doralash > "$snapshot"
          node -e '
            const fs = require("node:fs");
            const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const versions = payload.available_versions || {};
            const apps = versions["22.23.2"]?.users?.doralash?.applications || {};
            const safe = Object.entries(apps).map(([root, app]) => ({
              root,
              domain: app.domain,
              status: app.status,
              startup_file: app.startup_file,
              app_uri: app.app_uri,
              env_keys: Object.keys(app.env_vars || {}).sort(),
              venv: app.virtualenv,
            }));
            console.log(JSON.stringify({ result: payload.result, applications: safe }, null, 2));
          ' "$snapshot"
          printf 'current=%s\n' "$(readlink -f -- /home/doralash/accounting-app/current)"
          printf 'previous=%s\n' "$(readlink -f -- /home/doralash/accounting-app/previous)"
          for path in \
            /home/doralash/nodevenv/accounting-app/releases/0.1.0-1340b574957e/22 \
            /home/doralash/nodevenv/accounting-app/releases/0.1.0-59897e185ecd/22; do
            if [[ -d "$path" && ! -L "$path" ]]; then
              printf 'venv-present=%s\n' "$path"
            else
              printf 'venv-missing=%s\n' "$path"
            fi
          done
          set +e
          "$selector" create --help 2>&1
          printf 'create-help-exit=%s\n' "$?"
          REMOTE

