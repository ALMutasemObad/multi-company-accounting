name: production-cloudlinux-recreate

on:
  push:
    branches:
      - ops/cloudlinux-recreate

permissions:
  contents: read

concurrency:
  group: production-cloudlinux-recreate
  cancel-in-progress: false

jobs:
  recover:
    name: Recreate the production CloudLinux registration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      CPANEL_SSH_HOST: sv13.byethost13.org
      CPANEL_SSH_PORT: '1394'
      CPANEL_SSH_USER: doralash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure the pinned production SSH identity
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
        run: |
          test -n "$CPANEL_SSH_PRIVATE_KEY"
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          install -m 0600 deploy/ssh/ifastnet_known_hosts "$HOME/.ssh/known_hosts"
      - name: Recreate and verify the production registration
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -p "$CPANEL_SSH_PORT" -o IdentitiesOnly=yes \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" bash -s <<'REMOTE'
          set -Eeuo pipefail

          fail() { printf 'mcap-cloudlinux-recreate: %s\n' "$*" >&2; exit 1; }

          selector=/usr/sbin/cloudlinux-selector
          deploy_root=/home/doralash/accounting-app
          releases_dir="$deploy_root/releases"
          current_link="$deploy_root/current"
          previous_link="$deploy_root/previous"
          backup_dir="$deploy_root/recovery-backups"
          passenger_config=/home/doralash/accounting.doralashab.com/.htaccess
          target_app_root=accounting-app/releases/0.1.0-59897e185ecd
          target_release="/home/doralash/$target_app_root"
          target_venv=/home/doralash/nodevenv/accounting-app/releases/0.1.0-59897e185ecd/22
          live_url=https://accounting.doralashab.com/live
          ready_url=https://accounting.doralashab.com/ready

          [[ "$(id -un)" == doralash ]] || fail "unexpected remote user"
          [[ -x "$selector" ]] || fail "CloudLinux Node.js Selector is unavailable"
          [[ -d "$deploy_root" && ! -L "$deploy_root" && "$(readlink -f -- "$deploy_root")" == "$deploy_root" ]] \
            || fail "deployment root is invalid"
          [[ -d "$releases_dir" && ! -L "$releases_dir" ]] || fail "release directory is invalid"
          [[ -d "$backup_dir" && ! -L "$backup_dir" ]] || fail "recovery backup directory is invalid"
          [[ -f "$passenger_config" && ! -L "$passenger_config" ]] || fail "Passenger configuration is invalid"
          [[ -d "$target_release" && ! -L "$target_release" ]] || fail "target release is unavailable"
          [[ ! -e "$target_venv" && ! -L "$target_venv" ]] || fail "target virtualenv path already exists"
          [[ -f "$target_release/apps/api/dist/server.js" && ! -L "$target_release/apps/api/dist/server.js" ]] \
            || fail "target server entrypoint is invalid"

          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (manifest.releaseId !== "0.1.0-59897e185ecd" || manifest.commit !== "59897e185ecd2281ed0037cac39c243cb86ca5dd") {
              throw new Error("target release manifest does not match the trusted main commit");
            }
            console.log("Trusted target release manifest validated.");
          ' "$target_release/release-manifest.json"

          old_current=$(readlink -f -- "$current_link") || fail "current release link is unavailable"
          case "$old_current" in
            "$releases_dir/"*) ;;
            *) fail "current release resolved outside the release directory" ;;
          esac

          registry_snapshot=$(mktemp /tmp/mcap-selector-empty-check.XXXXXX)
          env_json_file=$(mktemp /tmp/mcap-selector-env.XXXXXX)
          create_result=$(mktemp /tmp/mcap-selector-create.XXXXXX)
          verify_result=$(mktemp /tmp/mcap-selector-verify.XXXXXX)
          restart_result=$(mktemp /tmp/mcap-selector-restart.XXXXXX)
          trap 'rm -f -- "$registry_snapshot" "$env_json_file" "$create_result" "$verify_result" "$restart_result"' EXIT
          umask 077

          "$selector" get --json --interpreter nodejs --user doralash > "$registry_snapshot"
          node -e '
            const fs = require("node:fs");
            const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const apps = payload.available_versions?.["22.23.2"]?.users?.doralash?.applications || {};
            const conflicts = Object.entries(apps).filter(([root, app]) =>
              root === process.argv[2] || app.domain === "accounting.doralashab.com"
            );
            if (payload.result !== "success" || conflicts.length) {
              throw new Error("the production registration state changed before recovery");
            }
            console.log("No conflicting accounting registration exists.");
          ' "$registry_snapshot" "$target_app_root"

          registry_backup=$(find "$backup_dir" -maxdepth 1 -type f \
            -name 'cloudlinux-selector-before-recreate-*.json' -printf '%T@ %p\n' \
            | sort -nr | head -n 1 | cut -d' ' -f2-)
          [[ -n "$registry_backup" && -f "$registry_backup" && ! -L "$registry_backup" ]] \
            || fail "protected selector registry backup is unavailable"
          [[ "$(stat -c '%U' -- "$registry_backup")" == doralash ]] || fail "registry backup ownership is invalid"
          [[ "$(stat -c '%a' -- "$registry_backup")" == 600 ]] || fail "registry backup permissions are invalid"

          node -e '
            const fs = require("node:fs");
            const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const root = "accounting-app/releases/0.1.0-1340b574957e";
            const app = payload.available_versions?.["22.23.2"]?.users?.doralash?.applications?.[root];
            if (payload.result !== "success" || !app || app.domain !== "accounting.doralashab.com") {
              throw new Error("registry backup does not contain the expected production application");
            }
            const required = ["DATABASE_URL", "WEB_ORIGIN", "SESSION_COOKIE_SECURE", "TRUST_PROXY"];
            for (const name of required) {
              if (!(name in (app.env_vars || {}))) throw new Error(`registry backup is missing ${name}`);
            }
            fs.writeFileSync(
              process.argv[2],
              JSON.stringify({ ...app.env_vars, PASSWORD_RESET_ENABLED: "false" }),
              { mode: 0o600 }
            );
            console.log("Protected environment backup validated without revealing values.");
          ' "$registry_backup" "$env_json_file"

          timestamp=$(date -u +%Y%m%dT%H%M%SZ)
          config_backup="$backup_dir/htaccess-before-final-cloudlinux-create-$timestamp"
          [[ ! -e "$config_backup" && ! -L "$config_backup" ]] || fail "configuration backup target already exists"
          cp -p -- "$passenger_config" "$config_backup"

          env_json=$(<"$env_json_file")
          set +e
          "$selector" create --json --interpreter nodejs --domain accounting.doralashab.com \
            --app-root "$target_app_root" --app-uri '' --version 22.23.2 --app-mode production \
            --startup-file apps/api/dist/server.js \
            --passenger-log-file /home/doralash/logs/accounting-passenger.log \
            --env-vars "$env_json" > "$create_result" 2>&1
          create_exit=$?
          set -e
          node -e '
            const fs = require("node:fs");
            let payload;
            try { payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); }
            catch { payload = { result: "invalid-json" }; }
            console.log(JSON.stringify({
              exit: Number(process.argv[2]),
              result: payload.result,
              warning: payload.warning,
              context_keys: Object.keys(payload.context || {}).sort(),
            }));
            if (Number(process.argv[2]) !== 0 || payload.result !== "success") {
              throw new Error("CloudLinux failed to create the replacement registration");
            }
          ' "$create_result" "$create_exit"

          "$selector" get --json --interpreter nodejs --user doralash > "$verify_result"
          node -e '
            const fs = require("node:fs");
            const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const app = payload.available_versions?.["22.23.2"]?.users?.doralash?.applications?.[process.argv[2]];
            const required = ["DATABASE_URL", "WEB_ORIGIN", "SESSION_COOKIE_SECURE", "TRUST_PROXY", "PASSWORD_RESET_ENABLED"];
            if (payload.result !== "success" || !app || app.domain !== "accounting.doralashab.com" ||
                app.startup_file !== "apps/api/dist/server.js") {
              throw new Error("replacement registration verification failed");
            }
            for (const name of required) if (!(name in (app.env_vars || {}))) throw new Error(`replacement registration is missing ${name}`);
            console.log(JSON.stringify({
              root: process.argv[2],
              domain: app.domain,
              status: app.status,
              environment_keys_present: required,
            }));
          ' "$verify_result" "$target_app_root"

          atomic_link() {
            local target=$1 link=$2 temporary
            temporary="${link}.next.$$"
            [[ ! -e "$temporary" && ! -L "$temporary" ]] || return 1
            ln -s -- "$target" "$temporary"
            mv -Tf -- "$temporary" "$link"
          }
          atomic_link "$old_current" "$previous_link"
          atomic_link "$target_release" "$current_link"

          set +e
          "$selector" restart --json --interpreter nodejs --user doralash \
            --app-root "$target_app_root" > "$restart_result" 2>&1
          restart_exit=$?
          set -e
          node -e '
            const fs = require("node:fs");
            let payload;
            try { payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); }
            catch { payload = { result: "invalid-json" }; }
            console.log(JSON.stringify({
              exit: Number(process.argv[2]),
              result: payload.result,
              warning: payload.warning,
              context_keys: Object.keys(payload.context || {}).sort(),
            }));
            if (Number(process.argv[2]) !== 0 || payload.result !== "success") {
              throw new Error("CloudLinux failed to restart the replacement registration");
            }
          ' "$restart_result" "$restart_exit"

          healthy=false
          for attempt in $(seq 1 30); do
            live_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 2 --max-time 4 "$live_url" || true)
            ready_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 2 --max-time 4 "$ready_url" || true)
            printf 'health attempt %s/30: live=%s ready=%s\n' "$attempt" "${live_status:-000}" "${ready_status:-000}"
            if [[ "$live_status" == 200 && "$ready_status" == 200 ]]; then
              healthy=true
              break
            fi
            sleep 2
          done
          [[ "$healthy" == true ]] || fail "replacement registration failed production health checks"

          printf 'mcap-cloudlinux-recreate: production is healthy on release %s\n' "$(basename -- "$target_release")"
          printf 'mcap-cloudlinux-recreate: recoverable configuration backup: %s\n' "$config_backup"
          REMOTE
