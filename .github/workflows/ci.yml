name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  hosting-compatibility:
    name: iFastNet compatibility (Node 22 / MariaDB 10.11)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mariadb:
        image: mariadb:10.11.11@sha256:96be0d3dfbeb07bc420e5fb8a6dc05c492676f1f89980a497a55e6fbbba3f1c4
        env:
          MYSQL_DATABASE: test_mcap_finance
          MYSQL_USER: mcap_test
          MYSQL_PASSWORD: test_database_password
          MYSQL_ROOT_PASSWORD: test_root_password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -umcap_test -ptest_database_password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DATABASE_URL: mysql://mcap_test:test_database_password@127.0.0.1:3306/test_mcap_finance
      R2_DATABASE_URL: mysql://mcap_test:test_database_password@127.0.0.1:3306/test_mcap_finance
      RUN_R2_DB_TESTS: 'true'
      R2_DB_MIGRATION_MODE: fresh
      SEED_ADMIN_PASSWORD: CI-Only-Admin-Password-2026!
      RUN_DB_TESTS: 'true'
      EXPECTED_DATABASE_VERSION_PREFIX: '10.11.11-MariaDB'
      CI_ROOT_DATABASE_PASSWORD: test_root_password
      CI_DATABASE_USER: mcap_test
      CI_RESTORE_DATABASE: mcap_finance_restore_test
      BACKUP_ENCRYPTION_PASSPHRASE: CI-only-database-backup-passphrase-2026
    steps:
      - name: Configure isolated R2 database evidence directory
        run: echo "R2_DB_GATE_ARTIFACT_DIR=$RUNNER_TEMP/r2-db-gate" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Pin the package manager
        run: npm install --global npm@12.0.2
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Verify generated OpenAPI guards
        run: npm run contracts:check
      - name: Verify iFastNet database engine family
        run: npm run database:verify-engine -w @mcap/api
      - name: Apply all migrations from an empty MariaDB database
        run: |
          npm exec -w @mcap/api -- prisma migrate deploy
          npm exec -w @mcap/api -- prisma migrate status
      - name: Seed deterministic integration fixtures
        run: |
          npm run prisma:seed -w @mcap/api
          npm run prisma:seed:demo -w @mcap/api
      - name: Prove named N1 recovery cases on a fresh isolated MariaDB database
        env:
          RUN_POS_RECOVERY_FINALIZATION_DB_TESTS: 'true'
          POS_RECOVERY_TEST_DATABASE: w1posrecovery
          POS_RECOVERY_CI_DATABASE_ACK: 'CREATE:w1posrecovery'
          POS_RECOVERY_EXPECTED_ENGINE_VERSION: '10.11.11-MariaDB'
          POS_RECOVERY_DB_GATE_ARTIFACT_DIR: ${{ runner.temp }}/pos-recovery-db-gate
        run: node scripts/ci/pos-recovery-db-gate.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: n1-pos-recovery-mariadb-fresh
          path: ${{ runner.temp }}/pos-recovery-db-gate/
          if-no-files-found: error
          retention-days: 7
      - name: Typecheck on the production Node major
        run: |
          npm run typecheck
          npm run e2e:typecheck
          npm run subscription-qa:typecheck
      - name: Reject hard-coded web interface text
        run: npm run i18n:check
      - name: Verify responsive and accessible web UI contracts
        run: npm run ui:check
      - name: Test API against MariaDB 10.11
        run: npm run test:db -w @mcap/api
      - name: Prove all R2 database tests executed on fresh MariaDB
        run: node scripts/ci/selling-profile-db-gate.mjs run
      - name: Build on the production Node major
        run: npm run build
      - name: Install Chromium for the end-to-end release gate
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Test onboarding and the first accounting document on MariaDB
        env:
          E2E_DISPOSABLE_DATABASE: test_mcap_finance
        run: npm run e2e
      - name: Install the MariaDB backup client
        run: |
          sudo apt-get update
          sudo apt-get install --yes mariadb-client
      - name: Prove encrypted backup and isolated restore on MariaDB
        env:
          MYSQL_BIN: mariadb
          MYSQLDUMP_BIN: mariadb-dump
        run: |
          bash scripts/ci/database-identities.integration.sh
          bash scripts/ci/database-roundtrip.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-mariadb-failure
          path: |
            playwright-report/
            test-results/playwright/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: r2-database-mariadb-fresh
          path: ${{ runner.temp }}/r2-db-gate/
          if-no-files-found: warn
          retention-days: 7

  migration-upgrade-compatibility:
    name: Production upgrade compatibility (${{ matrix.engine_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine_name: MariaDB 10.11
            image: mariadb:10.11.11@sha256:96be0d3dfbeb07bc420e5fb8a6dc05c492676f1f89980a497a55e6fbbba3f1c4
            expected_version: 10.11.11-MariaDB
            health_command: mariadb-admin ping -h 127.0.0.1 -umcap_test -ptest_database_password
          - engine_name: MySQL 8.4
            image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
            expected_version: '8.4.'
            health_command: mysqladmin ping -h 127.0.0.1 -umcap_test -ptest_database_password
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_DATABASE: test_mcap_finance
          MYSQL_USER: mcap_test
          MYSQL_PASSWORD: test_database_password
          MYSQL_ROOT_PASSWORD: test_root_password
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.health_command }}"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DATABASE_URL: mysql://mcap_test:test_database_password@127.0.0.1:3306/test_mcap_finance
      R2_DATABASE_URL: mysql://mcap_test:test_database_password@127.0.0.1:3306/test_mcap_finance
      RUN_R2_DB_TESTS: 'true'
      R2_DB_MIGRATION_MODE: upgrade
      SEED_ADMIN_PASSWORD: CI-Only-Admin-Password-2026!
      RUN_DB_TESTS: 'true'
      EXPECTED_DATABASE_VERSION_PREFIX: ${{ matrix.expected_version }}
      PRODUCTION_BASELINE_COMMIT: c39b97949655f43c9fe35f98b3d47cce5c6c6054
      PRODUCTION_BASELINE_MIGRATION_COUNT: '38'
    steps:
      - name: Configure isolated R2 database evidence directory
        run: echo "R2_DB_GATE_ARTIFACT_DIR=$RUNNER_TEMP/r2-db-gate" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Pin the package manager
        run: npm install --global npm@12.0.2
      - name: Install candidate locked dependencies
        run: npm ci
      - name: Generate the candidate Prisma client
        run: npm run prisma:generate
      - name: Verify the upgrade database engine
        run: npm run database:verify-engine -w @mcap/api
      - name: Upgrade the populated production baseline and prove old-application compatibility
        run: bash scripts/ci/database-upgrade-compatibility.sh
      - name: Seed current deterministic fixtures after the upgrade
        run: |
          npm run prisma:seed -w @mcap/api
          npm run prisma:seed:demo -w @mcap/api
      - name: Test the candidate API on the upgraded production baseline
        run: npm run test:db -w @mcap/api
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: r2-database-${{ matrix.engine_name }}-upgrade
          path: ${{ runner.temp }}/r2-db-gate/
          if-no-files-found: warn
          retention-days: 7

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      release_archive_sha256: ${{ steps.release.outputs.archive_sha256 }}
      release_manifest_sha256: ${{ steps.release.outputs.manifest_sha256 }}
    services:
      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_DATABASE: test_mcap_finance
          MYSQL_USER: mcap_test
          MYSQL_PASSWORD: test_database_password
          MYSQL_ROOT_PASSWORD: test_root_password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -umcap_test -ptest_database_password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DATABASE_URL: mysql://mcap_test:test_database_password@127.0.0.1:3306/test_mcap_finance
      R2_DATABASE_URL: mysql://mcap_test:test_database_password@127.0.0.1:3306/test_mcap_finance
      RUN_R2_DB_TESTS: 'true'
      R2_DB_MIGRATION_MODE: fresh
      SEED_ADMIN_PASSWORD: CI-Only-Admin-Password-2026!
      RUN_DB_TESTS: 'true'
      EXPECTED_DATABASE_VERSION_PREFIX: '8.4.'
      CI_ROOT_DATABASE_PASSWORD: test_root_password
      CI_DATABASE_USER: mcap_test
      CI_RESTORE_DATABASE: mcap_finance_restore_test
      BACKUP_ENCRYPTION_PASSPHRASE: CI-only-database-backup-passphrase-2026
    steps:
      - name: Configure isolated R2 database evidence directory
        run: echo "R2_DB_GATE_ARTIFACT_DIR=$RUNNER_TEMP/r2-db-gate" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Pin the package manager
        run: npm install --global npm@12.0.2
      - name: Install locked dependencies
        run: npm ci
      - name: Reject unapproved dependency install scripts
        run: npm run audit:install-scripts
      - name: Block critical build dependency vulnerabilities
        run: npm run audit:critical
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Verify generated OpenAPI guards
        run: npm run contracts:check
      - name: Verify MySQL 8.4 engine
        run: npm run database:verify-engine -w @mcap/api
      - name: Typecheck
        run: |
          npm run typecheck
          npm run e2e:typecheck
          npm run subscription-qa:typecheck
          node node_modules/typescript/bin/tsc -p tsconfig.grocery-integration.json --noEmit
      - name: Reject hard-coded web interface text
        run: npm run i18n:check
      - name: Verify responsive and accessible web UI contracts
        run: npm run ui:check
      - name: Apply all migrations from an empty MySQL database
        run: |
          npm exec -w @mcap/api -- prisma migrate deploy
          npm exec -w @mcap/api -- prisma migrate status
      - name: Seed deterministic integration fixtures
        run: |
          npm run prisma:seed -w @mcap/api
          npm run prisma:seed:demo -w @mcap/api
      - name: Prove named N1 recovery cases on a fresh isolated MySQL database
        env:
          RUN_POS_RECOVERY_FINALIZATION_DB_TESTS: 'true'
          POS_RECOVERY_TEST_DATABASE: w1posrecovery
          POS_RECOVERY_CI_DATABASE_ACK: 'CREATE:w1posrecovery'
          POS_RECOVERY_EXPECTED_ENGINE_VERSION: '8.4.11'
          POS_RECOVERY_DB_GATE_ARTIFACT_DIR: ${{ runner.temp }}/pos-recovery-db-gate
        run: node scripts/ci/pos-recovery-db-gate.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: n1-pos-recovery-mysql-fresh
          path: ${{ runner.temp }}/pos-recovery-db-gate/
          if-no-files-found: error
          retention-days: 7
      - name: Test infrastructure utilities
        run: npm run infra:test
      - name: Test API against MySQL 8.4
        run: npm run test:db -w @mcap/api
      - name: Prove all R2 database tests executed on fresh MySQL
        run: node scripts/ci/selling-profile-db-gate.mjs run
      - name: Test web application
        run: npm run test -w @mcap/web
      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@2.46.2 lint packages/contracts/openapi.yaml
      - name: Build production assets
        run: npm run build
      - name: Install Chromium for the end-to-end release gate
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Test grocery frontend integration with the HTTP harness in Chromium
        run: node node_modules/@playwright/test/cli.js test --config playwright.grocery-integration.config.ts
      - name: Test responsive journeys, subscription changes and billing recovery in Chromium
        run: npm run subscription-qa:test
      - name: Accept the fixed 58 subscription discovery and context cases
        run: |
          npm run subscription-acceptance:typecheck
          npm run subscription-acceptance:test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: subscription-acceptance-58
          path: |
            test-results/subscription-acceptance/run-*/invocation.json
            test-results/subscription-acceptance/run-*/readiness.json
            test-results/subscription-acceptance/run-*/gate-report.json
            test-results/subscription-acceptance/run-*/results.json
            test-results/subscription-acceptance/run-*/html/
            test-results/subscription-acceptance/run-*/artifacts/
          if-no-files-found: error
          retention-days: 7
      - name: Test onboarding and the first accounting document on MySQL
        env:
          E2E_DISPOSABLE_DATABASE: test_mcap_finance
        run: npm run e2e
      - name: Prove encrypted backup and isolated restore on MySQL
        run: |
          bash scripts/ci/database-identities.integration.sh
          bash scripts/ci/database-roundtrip.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-mysql-failure
          path: |
            playwright-report/
            test-results/playwright/
            playwright-responsive-report/
            test-results/responsive-ui/
            test-results/subscription-readiness-integration/
            test-results/track-e/
            tmp/agent/grocery-integration-results/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: r2-database-mysql-fresh
          path: ${{ runner.temp }}/r2-db-gate/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove build-only and optional dependencies
        run: npm prune --omit=dev --omit=optional
      - name: Block high production dependency vulnerabilities
        run: npm run audit:production
      - name: Smoke-test production runtime and graceful shutdown
        env:
          NODE_ENV: production
          PORT: '3100'
          WEB_ORIGIN: https://ci.mcap.example
          SESSION_COOKIE_SECURE: 'true'
          TRUST_PROXY: 'true'
          RATE_LIMIT_IDENTITY_SECRET: ci-only-stable-rate-limit-identity-secret-2026
          SELF_REGISTRATION_ENABLED: 'false'
        run: |
          node apps/api/dist/server.js > api-smoke.log 2>&1 &
          api_pid=$!
          trap 'kill -TERM "$api_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3100/ready >/dev/null; then break; fi
            if ! kill -0 "$api_pid" 2>/dev/null; then cat api-smoke.log; exit 1; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:3100/live >/dev/null
          curl --silent --fail http://127.0.0.1:3100/ready >/dev/null
          curl --silent --fail http://127.0.0.1:3100/ | grep --fixed-strings '<div id="root"></div>'
          kill -TERM "$api_pid"
          wait "$api_pid"
          trap - EXIT
          grep 'api_shutdown_completed' api-smoke.log
      - name: Validate atomic deployment scripts
        run: |
          bash -n deploy/scripts/install-release.sh deploy/scripts/rollback-release.sh \
            deploy/scripts/install-cpanel-release.sh deploy/scripts/rollback-cpanel-release.sh \
            deploy/scripts/deploy-cpanel-release.sh deploy/scripts/switch-cloudlinux-registration.sh \
            deploy/scripts/create-cpanel-offsite-backup.sh \
            deploy/scripts/migrate-staging-platform-operator-ids.sh \
            scripts/release/package-release.sh \
            scripts/ci/database-roundtrip.sh scripts/ci/database-identities.integration.sh \
            scripts/ci/database-upgrade-compatibility.sh \
            scripts/tests/deployment-rollback.integration.sh \
            scripts/tests/cloudlinux-registration.integration.sh
          curl --fail --silent --show-error --location \
            --output /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz' \
            | sha256sum --check
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          /tmp/shellcheck-v0.11.0/shellcheck --shell=bash --severity=warning \
            deploy/scripts/install-release.sh deploy/scripts/rollback-release.sh \
            deploy/scripts/install-cpanel-release.sh deploy/scripts/rollback-cpanel-release.sh \
            deploy/scripts/deploy-cpanel-release.sh deploy/scripts/switch-cloudlinux-registration.sh \
            deploy/scripts/create-cpanel-offsite-backup.sh \
            deploy/scripts/migrate-staging-platform-operator-ids.sh \
            scripts/release/package-release.sh \
            scripts/ci/database-identities.integration.sh \
            scripts/ci/database-upgrade-compatibility.sh \
            scripts/tests/cloudlinux-registration.integration.sh
          bash scripts/tests/deployment-rollback.integration.sh
          bash scripts/tests/cloudlinux-registration.integration.sh
      - name: Create reproducible verified release
        id: release
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TARGET: linux-x64
        run: |
          bash scripts/release/package-release.sh . . | tee release-digests.txt
          cat release-digests.txt >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy staging to iFastNet
    needs: [hosting-compatibility, migration-upgrade-compatibility, verify]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      # Legacy secret scope only. The URL below is Staging; this name must not be
      # interpreted as a live-production target or reused by a future production workflow.
      name: production
      url: https://accounting.doralashab.com
    env:
      CPANEL_SSH_HOST: sv13.byethost13.org
      CPANEL_SSH_PORT: '1394'
      CPANEL_SSH_USER: doralash
      CPANEL_DEPLOY_ROOT: /home/doralash/accounting-app
      CPANEL_BACKUP_DIRECTORY: /home/doralash/backups/mcap
      CPANEL_PASSENGER_CONFIG_FILE: /home/doralash/accounting.doralashab.com/.htaccess
      CPANEL_APP_URL: https://accounting.doralashab.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Verify merged pull request provenance for staging
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pull_requests=$(mktemp)
          trap 'rm -f -- "$pull_requests"' EXIT
          curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls?per_page=100" \
            > "$pull_requests"
          node -e '
            const fs = require("node:fs");
            const [pullRequestsPath, eventPath, repository, sha] = process.argv.slice(1);
            const event = JSON.parse(fs.readFileSync(eventPath, "utf8"));
            const pullRequests = JSON.parse(fs.readFileSync(pullRequestsPath, "utf8"));
            const matches = pullRequests.filter((pullRequest) =>
              pullRequest.state === "closed" &&
              pullRequest.merged_at &&
              pullRequest.base?.ref === "main" &&
              pullRequest.base?.repo?.full_name === repository &&
              pullRequest.merge_commit_sha === sha
            );
            if (event.forced || matches.length !== 1) {
              console.error("Staging deployment requires exactly one merged pull request into main and rejects forced pushes.");
              process.exit(1);
            }
            console.log(`Verified merged pull request #${matches[0].number} for staging deployment.`);
          ' "$pull_requests" "$GITHUB_EVENT_PATH" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
          rm -f -- "$pull_requests"
          trap - EXIT
      - name: Verify a manual staging deployment uses the current main revision
        if: github.event_name == 'workflow_dispatch'
        run: |
          current_main=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          test "${#current_main}" -eq 40
          test "$current_main" = "$GITHUB_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Pin the package manager
        run: npm install --global npm@12.0.2
      - name: Rebuild the verified staging release from the selected revision
        env:
          # Prisma loads its configuration while generating the client. This URL is
          # syntactically valid but deliberately points at an unused local database;
          # release construction never connects to it.
          DATABASE_URL: mysql://release_build:release_build@127.0.0.1:3306/release_build
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TARGET: linux-x64
          VERIFIED_ARCHIVE_SHA256: ${{ needs.verify.outputs.release_archive_sha256 }}
          VERIFIED_MANIFEST_SHA256: ${{ needs.verify.outputs.release_manifest_sha256 }}
        run: |
          npm ci
          npm run audit:install-scripts
          npm run audit:critical
          npm run prisma:generate
          npm run contracts:check
          npm run build
          npm prune --omit=dev --omit=optional
          npm run audit:production

          bash scripts/release/package-release.sh . staging-artifact

          case "$VERIFIED_ARCHIVE_SHA256" in
            ''|*[!0-9a-f]*) printf 'invalid verified archive digest\n' >&2; exit 1 ;;
          esac
          case "$VERIFIED_MANIFEST_SHA256" in
            ''|*[!0-9a-f]*) printf 'invalid verified manifest digest\n' >&2; exit 1 ;;
          esac
          test "${#VERIFIED_ARCHIVE_SHA256}" -eq 64
          test "${#VERIFIED_MANIFEST_SHA256}" -eq 64
          test "$(sha256sum staging-artifact/mcap-finance-linux-x64.tgz | awk '{print $1}')" \
            = "$VERIFIED_ARCHIVE_SHA256"
          test "$(sha256sum staging-artifact/mcap-finance-linux-x64.manifest.json | awk '{print $1}')" \
            = "$VERIFIED_MANIFEST_SHA256"
      - name: Configure the pinned staging SSH identity
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
        run: |
          test -n "$CPANEL_SSH_PRIVATE_KEY"
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          install -m 0600 deploy/ssh/ifastnet_known_hosts "$HOME/.ssh/known_hosts"
      - name: Preflight the Staging database and operator identity read-only
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          set -Eeuo pipefail

          node --input-type=module <<'NODE'
          const value = process.env.MIGRATION_DATABASE_URL;
          const retiredDatabaseBrand = new RegExp(["j", "[aeiou]", "wa{1,2}r"].join(""), "iu");
          if (!value || value.length > 2_048) {
            throw new Error("The Staging migration database URL is missing or exceeds the accepted bound.");
          }
          let parsed;
          try {
            parsed = new URL(value);
          } catch {
            throw new Error("The Staging migration database URL is invalid.");
          }
          if (parsed.protocol !== "mysql:") {
            throw new Error("The Staging migration database URL must use MySQL.");
          }
          let schemaName;
          try {
            schemaName = decodeURIComponent(parsed.pathname);
          } catch {
            throw new Error("The Staging migration schema identifier is invalid.");
          }
          if (retiredDatabaseBrand.test(schemaName)) {
            throw new Error("The Staging migration schema still carries the retired product identifier.");
          }
          console.log("Validated the Staging migration target without revealing its value.");
          NODE

          ssh -i "$HOME/.ssh/id_ed25519" -p "$CPANEL_SSH_PORT" -o IdentitiesOnly=yes \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            env \
              MCAP_DEPLOY_ROOT="$CPANEL_DEPLOY_ROOT" \
              MCAP_PASSENGER_CONFIG_FILE="$CPANEL_PASSENGER_CONFIG_FILE" \
              MCAP_NODE_BIN=/opt/alt/alt-nodejs22/root/usr/bin/node \
              MCAP_CLOUDLINUX_SELECTOR=/usr/sbin/cloudlinux-selector \
              MCAP_CLOUDLINUX_USER="$CPANEL_SSH_USER" \
              MCAP_CLOUDLINUX_DOMAIN=accounting.doralashab.com \
              MCAP_CLOUDLINUX_VERSION=22.23.2 \
              bash -s <<'REMOTE'
          set -Eeuo pipefail

          deploy_root=${MCAP_DEPLOY_ROOT:?}
          passenger_config=${MCAP_PASSENGER_CONFIG_FILE:?}
          node_bin=${MCAP_NODE_BIN:?}
          selector=${MCAP_CLOUDLINUX_SELECTOR:?}

          "$node_bin" --input-type=module - \
            "$deploy_root/shared/passenger.env" \
            "$passenger_config" \
            "$selector" \
            "$MCAP_CLOUDLINUX_VERSION" \
            "$MCAP_CLOUDLINUX_USER" \
            "$MCAP_CLOUDLINUX_DOMAIN" <<'NODE'
          import fs from "node:fs";
          import { spawnSync } from "node:child_process";

          const [environmentFile, passengerConfig, selector, version, user, domain] = process.argv.slice(2);
          const retiredDatabaseBrand = new RegExp(["j", "[aeiou]", "wa{1,2}r"].join(""), "iu");
          const sources = [];

          const unquote = (value) => {
            const trimmed = value.trim();
            if (trimmed.length >= 2 && ((trimmed.startsWith('"') && trimmed.endsWith('"')) ||
                (trimmed.startsWith("'") && trimmed.endsWith("'")))) {
              return trimmed.slice(1, -1);
            }
            return trimmed;
          };

          if (fs.existsSync(environmentFile)) {
            const environment = {};
            for (const line of fs.readFileSync(environmentFile, "utf8").split(/\r?\n/u)) {
              const match = line.match(/^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)=(.*)$/u);
              if (match) environment[match[1]] = unquote(match[2]);
            }
            sources.push({ label: "protected environment file", environment });
          }

          if (fs.existsSync(passengerConfig)) {
            const environment = {};
            for (const line of fs.readFileSync(passengerConfig, "utf8").split(/\r?\n/u)) {
              const match = line.match(/^\s*SetEnv\s+([A-Za-z_][A-Za-z0-9_]*)\s+(.+?)\s*$/u);
              if (match) environment[match[1]] = unquote(match[2]);
            }
            if (Object.keys(environment).length > 0) {
              sources.push({ label: "Passenger configuration", environment });
            }
          }

          let selectorAvailable = true;
          try {
            fs.accessSync(selector, fs.constants.X_OK);
          } catch {
            // A protected environment file or Passenger SetEnv remains a valid runtime source.
            selectorAvailable = false;
          }
          if (selectorAvailable) {
            const selectorResult = spawnSync(
              selector,
              ["get", "--json", "--interpreter", "nodejs", "--user", user],
              { encoding: "utf8", stdio: ["ignore", "pipe", "ignore"], maxBuffer: 4 * 1_024 * 1_024 },
            );
            if (selectorResult.status !== 0 || typeof selectorResult.stdout !== "string" ||
                !selectorResult.stdout.trim()) {
              throw new Error("The active Staging CloudLinux registry could not be read.");
            }
            let payload;
            try {
              payload = JSON.parse(selectorResult.stdout);
            } catch {
              throw new Error("The CloudLinux runtime registry could not be parsed.");
            }
            const applications = payload.available_versions?.[version]?.users?.[user]?.applications || {};
            const matches = Object.values(applications).filter((application) => application?.domain === domain);
            if (payload.result !== "success" || matches.length !== 1) {
              throw new Error("The active Staging CloudLinux registration is ambiguous or unavailable.");
            }
            sources.push({ label: "CloudLinux registration", environment: matches[0].env_vars || {} });
          }

          const databaseSources = sources.filter(({ environment }) =>
            typeof environment.DATABASE_URL === "string" && environment.DATABASE_URL.length > 0,
          );
          if (databaseSources.length === 0) {
            throw new Error("No bounded Staging runtime DATABASE_URL source was found.");
          }

          for (const { label, environment } of sources) {
            if (typeof environment.PLATFORM_OPERATOR_EMAILS === "string" &&
                environment.PLATFORM_OPERATOR_EMAILS.trim().length > 0) {
              throw new Error(`${label} still enables the development-only platform operator email allowlist.`);
            }
            if (typeof environment.DATABASE_URL !== "string" || environment.DATABASE_URL.length === 0) continue;
            let parsed;
            try {
              parsed = new URL(environment.DATABASE_URL);
            } catch {
              throw new Error(`${label} contains an invalid runtime database URL.`);
            }
            let schemaName;
            try {
              schemaName = decodeURIComponent(parsed.pathname);
            } catch {
              throw new Error(`${label} contains an invalid runtime schema identifier.`);
            }
            if (parsed.protocol !== "mysql:" || retiredDatabaseBrand.test(schemaName)) {
              throw new Error(`${label} does not point to an approved neutral MySQL schema.`);
            }
          }

          console.log(`Validated ${sources.length} Staging runtime configuration source(s) without revealing values.`);
          NODE
          REMOTE
      - name: Upload the immutable staging artifact
        run: |
          test "${#GITHUB_SHA}" -eq 40
          remote_dir="$CPANEL_DEPLOY_ROOT/incoming/github-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -i "$HOME/.ssh/id_ed25519" -p "$CPANEL_SSH_PORT" -o IdentitiesOnly=yes \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" bash -s -- "$remote_dir" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          remote_dir=$1
          case "$remote_dir" in
            /home/doralash/accounting-app/incoming/github-[0-9a-f]*) ;;
            *) printf 'invalid remote artifact directory\n' >&2; exit 1 ;;
          esac
          test ! -e "$remote_dir"
          mkdir -p -- "$(dirname -- "$remote_dir")"
          mkdir -m 0700 -- "$remote_dir"
          REMOTE
          scp -i "$HOME/.ssh/id_ed25519" -P "$CPANEL_SSH_PORT" -o IdentitiesOnly=yes \
            staging-artifact/mcap-finance-linux-x64.tgz \
            staging-artifact/mcap-finance-linux-x64.tgz.sha256 \
            deploy/scripts/install-cpanel-release.sh \
            deploy/scripts/deploy-cpanel-release.sh \
            deploy/scripts/switch-cloudlinux-registration.sh \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST:$remote_dir/"
      - name: Back up, migrate, and activate staging atomically
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          METRICS_BEARER_TOKEN: ${{ secrets.METRICS_BEARER_TOKEN }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          test "${#BACKUP_ENCRYPTION_PASSPHRASE}" -ge 32
          test "${#METRICS_BEARER_TOKEN}" -ge 32
          test "${#METRICS_BEARER_TOKEN}" -le 500
          case "$MIGRATION_DATABASE_URL" in mysql://*) ;; *) exit 1 ;; esac
          test "${#MIGRATION_DATABASE_URL}" -le 2048
          remote_dir="$CPANEL_DEPLOY_ROOT/incoming/github-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          { printf '%s\n' "$BACKUP_ENCRYPTION_PASSPHRASE"; printf '%s\n' "$METRICS_BEARER_TOKEN"; printf '%s\n' "$MIGRATION_DATABASE_URL"; } | \
            ssh -i "$HOME/.ssh/id_ed25519" -p "$CPANEL_SSH_PORT" -o IdentitiesOnly=yes \
              "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
              env \
                MCAP_DEPLOY_ROOT="$CPANEL_DEPLOY_ROOT" \
                MCAP_BACKUP_DIRECTORY="$CPANEL_BACKUP_DIRECTORY" \
                MCAP_NODE_BIN=/opt/alt/alt-nodejs22/root/usr/bin/node \
                MCAP_NPX_CLI=/opt/alt/alt-nodejs22/root/usr/lib/node_modules/npm/bin/npx-cli.js \
                MCAP_MYSQL_BIN=/usr/bin/mysql \
                MCAP_MYSQLDUMP_BIN=/usr/bin/mysqldump \
                MCAP_PIPELINE_LOCK_WAIT_SECONDS=900 \
                MCAP_HEALTH_URL="$CPANEL_APP_URL/ready" \
                MCAP_APP_URL="$CPANEL_APP_URL" \
                MCAP_PASSENGER_CONFIG_FILE="$CPANEL_PASSENGER_CONFIG_FILE" \
                MCAP_CLOUDLINUX_SELECTOR=/usr/sbin/cloudlinux-selector \
                MCAP_CLOUDLINUX_USER="$CPANEL_SSH_USER" \
                MCAP_CLOUDLINUX_HOME=/home/doralash \
                MCAP_CLOUDLINUX_DOMAIN=accounting.doralashab.com \
                MCAP_CLOUDLINUX_VERSION=22.23.2 \
                MCAP_CLOUDLINUX_PASSENGER_LOG_FILE=/home/doralash/logs/accounting-passenger.log \
                MCAP_CLOUDLINUX_BACKUP_DIRECTORY="$CPANEL_DEPLOY_ROOT/recovery-backups" \
                bash "$remote_dir/deploy-cpanel-release.sh" \
                  "$remote_dir/mcap-finance-linux-x64.tgz" \
                  "$remote_dir/mcap-finance-linux-x64.tgz.sha256"
      - name: Verify the public staging endpoints
        env:
          METRICS_BEARER_TOKEN: ${{ secrets.METRICS_BEARER_TOKEN }}
        run: |
          http_app_url="http://${CPANEL_APP_URL#https://}"
          redirect_probe_path="/ready?mcap_https_redirect_probe=$GITHUB_RUN_ID"
          redirect_headers=$(mktemp)
          trap 'rm -f -- "$redirect_headers"' EXIT
          redirect_status=$(curl --silent --show-error --max-time 10 --max-redirs 0 \
            --proto '=http' --output /dev/null --dump-header "$redirect_headers" \
            --write-out '%{http_code}' "$http_app_url$redirect_probe_path")
          redirect_location=$(awk 'BEGIN { IGNORECASE=1 } /^Location:/ {
            sub(/\r$/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit
          }' "$redirect_headers")
          case "$redirect_status" in 301|308) ;; *) exit 1 ;; esac
          test "$redirect_location" = "$CPANEL_APP_URL$redirect_probe_path"
          curl --fail --silent --show-error --max-time 10 "$CPANEL_APP_URL/live"
          curl --fail --silent --show-error --max-time 10 "$CPANEL_APP_URL/ready"
          metrics_status=$(curl --silent --show-error --max-time 10 --output /dev/null \
            --write-out '%{http_code}' "$CPANEL_APP_URL/metrics")
          test "$metrics_status" = 401
          metrics_output=$(mktemp)
          trap 'rm -f -- "$redirect_headers" "$metrics_output"' EXIT
          curl --fail --silent --show-error --max-time 10 \
            --header "Authorization: Bearer $METRICS_BEARER_TOKEN" \
            --output "$metrics_output" "$CPANEL_APP_URL/metrics"
          grep --fixed-strings '# TYPE mcap_operational_alert_active gauge' "$metrics_output"
          active_alerts=$(awk '
            /^mcap_operational_alert_active\{alert="[A-Z0-9_]+"\} 1$/ {
              line=$0; sub(/^.*alert="/, "", line); sub(/"\} 1$/, "", line); print line
            }
          ' "$metrics_output")
          if test -n "$active_alerts"; then
            while IFS= read -r alert; do
              printf '::error title=Staging operational alert::%s\n' "$alert"
            done <<< "$active_alerts"
            exit 1
          fi
          rm -f -- "$redirect_headers"
          rm -f -- "$metrics_output"
          trap - EXIT

  # Intentionally no production deployment job. A future live target must use a
  # separate workflow_dispatch-only workflow and a reviewer-protected production environment.
